name: CI

on:
    push:
    pull_request:
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 8

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install Linux runtime dependencies for Electron
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    xvfb \
                    libgtk-3-0 \
                    libnss3 \
                    libxss1 \
                    libasound2t64 \
                    libxtst6 \
                    libxrandr2 \
                    libgbm1 \
                    libxshmfence1

            - name: Install app dependencies
              run: npm install

            - name: Fetch resource index (same as release build)
              run: |
                  test -f src/index/index.sqlite
                  test -d src/index/resource_containers
                  rm -f src/index/resource_containers/en_ta-audio_vol2.tsrc
                  rm -f src/index/resource_containers/en_ta-checking_vol1.tsrc
                  rm -f src/index/resource_containers/en_ta-checking_vol2.tsrc
                  rm -f src/index/resource_containers/en_ta-gateway_vol3.tsrc
                  rm -f src/index/resource_containers/en_ta-intro_vol1.tsrc
                  rm -f src/index/resource_containers/en_ta-process_vol1.tsrc
                  rm -f src/index/resource_containers/en_ta-translate_vol1.tsrc
                  rm -f src/index/resource_containers/en_ta-translate_vol2.tsrc

            - name: Bower install
              run: npx bower install

            - name: Run e2e tests
              env:
                  DISPLAY: ":99"
                  # ELECTRON_ENABLE_LOGGING: "1" # Print browser console output.
              run: |
                  Xvfb :99 -screen 0 1920x1080x24 &
                  bash e2e_tests/run-tests.sh

    build:
        needs: e2e
        # The type of runner that the job will run on
        runs-on: macos-latest

        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - uses: actions/checkout@v4

            - name: Decrypt secret file
              shell: bash
              run: ./.github/scripts/decrypt_secret.sh
              env:
                  LARGE_SECRET_PASSPHRASE: ${{ secrets.LARGE_SECRET_PASSPHRASE }}

            # Runs build script. Packages all platforms and releases Linux + Mac.
            # The Windows installer is built (and signed) in the package-and-sign-windows job.
            - name: Buildscript
              id: buildscript
              shell: bash
              run: ./.github/scripts/build.sh

            - name: Upload unpacked windows app
              uses: actions/upload-artifact@v4
              with:
                  name: win-unpacked
                  include-hidden-files: true
                  path: out/BTT-Writer-win32-x64/
                  retention-days: 7

            - name: Upload Linux and osx releases
              uses: actions/upload-artifact@v4
              with:
                  name: mac-linux-release
                  include-hidden-files: true
                  path: release/
                  retention-days: 7

        outputs:
            APP_VERSION: ${{ steps.buildscript.outputs.APP_VERSION }}

    package-and-sign-windows:
        needs: build
        runs-on: windows-latest
        env:
            AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
            AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
            AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET Core SDK
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 6.0.x

            - name: Download unpacked windows app
              uses: actions/download-artifact@v4
              with:
                  name: win-unpacked
                  path: out/BTT-Writer-win32-x64

            # Sign the app binaries before they get bundled into the installer.
            # Not recursive on purpose: third party binaries shipped inside the app
            # (prince, git) keep their own signatures.
            - name: Sign app binaries with Azure Trusted Signing
              if: env.AZURE_CLIENT_ID != ''
              uses: azure/trusted-signing-action@v0.4.0
              with:
                  azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
                  azure-client-id: ${{ env.AZURE_CLIENT_ID }}
                  azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
                  endpoint: https://eus.codesigning.azure.net/
                  trusted-signing-account-name: ${{ env.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
                  certificate-profile-name: ${{ env.AZURE_CERTIFICATE_PROFILE_NAME }}
                  files-folder: ${{ github.workspace }}\out\BTT-Writer-win32-x64
                  files-folder-filter: exe,dll
                  files-folder-recurse: false
                  file-digest: SHA256
                  timestamp-rfc3161: http://timestamp.acs.microsoft.com
                  timestamp-digest: SHA256

            - name: Build windows installer
              shell: pwsh
              env:
                  APP_VERSION: ${{ needs.build.outputs.APP_VERSION }}
              run: ./.github/scripts/build_win_installer.ps1

            - name: Sign installer with Azure Trusted Signing
              if: env.AZURE_CLIENT_ID != ''
              uses: azure/trusted-signing-action@v0.4.0
              with:
                  azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
                  azure-client-id: ${{ env.AZURE_CLIENT_ID }}
                  azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
                  endpoint: https://eus.codesigning.azure.net/
                  trusted-signing-account-name: ${{ env.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
                  certificate-profile-name: ${{ env.AZURE_CERTIFICATE_PROFILE_NAME }}
                  files-folder: ${{ github.workspace }}\release
                  files-folder-filter: exe
                  files-folder-recurse: false
                  file-digest: SHA256
                  timestamp-rfc3161: http://timestamp.acs.microsoft.com
                  timestamp-digest: SHA256

            - name: Upload signed windows installer
              uses: actions/upload-artifact@v4
              with:
                  name: win-release
                  path: release/*.exe
                  retention-days: 7

    upload:
        needs: [build, package-and-sign-windows]
        runs-on: ubuntu-latest
        steps:
            - uses: FranzDiebold/github-env-vars-action@v2.1.0

            - name: Download Linux and Mac releases
              uses: actions/download-artifact@v4
              with:
                  name: mac-linux-release
                  path: release

            - name: Download signed windows installer
              uses: actions/download-artifact@v4
              with:
                  name: win-release
                  path: release

            #upload builds to AWS nightly-builds
            - name: set s3 destination_dir for nightly-builds
              run: echo "CURRENT_S3_DESTINATION=$CI_REPOSITORY_OWNER/$CI_REPOSITORY_NAME/$CI_REF_NAME_SLUG/$CI_RUN_NUMBER" >> $GITHUB_ENV

            - name: Upload file to bucket
              uses: shallwefootball/s3-upload-action@v1.1.3
              with:
                  aws_key_id: ${{ secrets.AWS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
                  aws_bucket: ${{ secrets.AWS_BUCKET }}
                  source_dir: ./release
                  destination_dir: ${{ env.CURRENT_S3_DESTINATION }}

            - name: upload artifacts to github releases on tags
              uses: "marvinpinto/action-automatic-releases@v1.2.1"
              if: contains( github.ref, 'refs/tags/v' )
              with:
                  repo_token: "${{ secrets.GITHUB_TOKEN }}"
                  prerelease: false
                  files: release/*.*
