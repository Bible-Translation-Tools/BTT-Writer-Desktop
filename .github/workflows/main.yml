name: CI

on:
    push:
    pull_request:
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install Linux runtime dependencies for Electron
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    xvfb \
                    libgtk-3-0 \
                    libnss3 \
                    libxss1 \
                    libasound2t64 \
                    libxtst6 \
                    libxrandr2 \
                    libgbm1 \
                    libxshmfence1

            - name: Install app dependencies
              run: npm install

            - name: Run unit tests
              run: |
                  npm test
                  npx gulp test

            - name: Fetch resource index (same as release build)
              run: |
                  test -f src/index/index.sqlite
                  test -d src/index/resource_containers
                  rm -f src/index/resource_containers/en_ta-audio_vol2.tsrc
                  rm -f src/index/resource_containers/en_ta-checking_vol1.tsrc
                  rm -f src/index/resource_containers/en_ta-checking_vol2.tsrc
                  rm -f src/index/resource_containers/en_ta-gateway_vol3.tsrc
                  rm -f src/index/resource_containers/en_ta-intro_vol1.tsrc
                  rm -f src/index/resource_containers/en_ta-process_vol1.tsrc
                  rm -f src/index/resource_containers/en_ta-translate_vol1.tsrc
                  rm -f src/index/resource_containers/en_ta-translate_vol2.tsrc

            - name: Bower install
              run: npx bower install

            - name: Run e2e tests
              env:
                  DISPLAY: ":99"
                  # ELECTRON_ENABLE_LOGGING: "1" # Print browser console output.
              run: |
                  Xvfb :99 -screen 0 1920x1080x24 &
                  bash e2e_tests/run-tests.sh

    # Each platform is packaged on its own OS, so no wine / cross-tooling is needed.
    build:
        needs: test
        name: build (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60

        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: win
                      os: windows-latest
                    - target: linux
                      os: ubuntu-latest
                    - target: osx
                      os: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            # scripts/win_installer.iss is written for Inno Setup 5 ({pf}, the
            # "0,6.1" version syntax and the Greek/Serbian .isl files that
            # Inno Setup 6 dropped), so pin the same 5.5.3 the old wine-based
            # build used (scripts/innosetup/innoinstall.sh).
            - name: Install Inno Setup 5.5.3
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $installer = Join-Path $env:RUNNER_TEMP 'isetup-5.5.3.exe'
                  Invoke-WebRequest -Uri 'https://files.jrsoftware.org/is/5/isetup-5.5.3.exe' -OutFile $installer
                  $proc = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\inno' -Wait -PassThru
                  if ($proc.ExitCode -ne 0) { throw "Inno Setup installer failed with exit code $($proc.ExitCode)" }
                  Add-Content -Path $env:GITHUB_PATH -Value 'C:\inno'

            - name: Install .deb packaging tools
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y fakeroot dpkg

            - name: Decrypt secret file
              shell: bash
              run: bash ./.github/scripts/decrypt_secret.sh
              env:
                  LARGE_SECRET_PASSPHRASE: ${{ secrets.LARGE_SECRET_PASSPHRASE }}

            - name: Build and package
              shell: bash
              run: bash ./.github/scripts/build.sh ${{ matrix.target }}

            # Installers are already compressed, so skip artifact compression.
            # The publish job picks these up; S3 is the long-term store.
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ matrix.target }}
                  path: release/
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 3

    publish:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write

        steps:
            - uses: FranzDiebold/github-env-vars-action@v2

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: release-*
                  merge-multiple: true
                  path: release

            - name: List release files
              run: ls -la release/

            #upload builds to AWS nightlybuilds
            - name: set s3 destination_dir for nightly-builds
              run: echo "CURRENT_S3_DESTINATION=$CI_REPOSITORY_OWNER/$CI_REPOSITORY_NAME/$CI_REF_NAME_SLUG/$CI_RUN_NUMBER" >> $GITHUB_ENV
            - name: Upload file to bucket
              uses: shallwefootball/s3-upload-action@v1.1.3
              with:
                  aws_key_id: ${{ secrets.AWS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
                  aws_bucket: ${{ secrets.AWS_BUCKET }}
                  source_dir: ./release
                  destination_dir: ${{ env.CURRENT_S3_DESTINATION }}

            - name: upload artifacts to github releases on tags
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/v')
              with:
                  files: release/*
                  prerelease: false
                  generate_release_notes: true
