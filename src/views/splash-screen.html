<!DOCTYPE html>
<html>

<head>
    <title>BTT Writer</title>

    <script src="../components/webcomponentsjs/webcomponents-lite.min.js"></script>

    <link rel="stylesheet" href="../css/main.css">

    <link rel="import" href="../components/polymer/polymer.html">
    <link rel="import" href="../elements/ts-main/ts-splash.html">
    <link rel="import" href="../elements/ts-main/app-theme.html">

</head>

<body>
    <ts-splash id="splash"></ts-splash>

    <script>
        (function () {
            const splash = document.getElementById('splash');
            const versiontext = splashAPI.translate("version_title", splashAPI.version);
            splash.content = {
                title: "BTT Writer",
                subtitle: versiontext,
                message: splashAPI.translate("loading_text")
            };

            splashAPI.sendThemeLoaded();

            splashAPI.onLoadingStatus(function (status) {
                splash.updateMessage(status);
            });
        })();
    </script>
</body>

</html>
