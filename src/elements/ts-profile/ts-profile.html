
<link rel="import" href="../../components/neon-animation/neon-animation.html">
<link rel="import" href="../../components/iron-icon/iron-icon.html">

<link rel="import" href="./ts-options-menu.html">
<link rel="import" href="./ts-login-option.html">
<link rel="import" href="./ts-create-option.html">
<link rel="import" href="./ts-local-option.html">

<link rel="import" href="../ts-icons/ts-icons.html">
<link rel="import" href="./ts-profile-sidebar.html">

<dom-module id="ts-profile">

    <style>

        :host {
            display: flex;
            flex-direction: column;
        }

        #main {
            flex: auto;
            display: flex;
            flex-direction: row;
        }

        neon-animated-pages {
            flex: auto;
            display: flex;
            flex-direction: column;
        }

        #header {
            background-color: var(--primary-color);
            min-height: 50px;
        }

        #heading {
            font-size: 125%;
            color: white;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 50px;
        }

        #backbutton {
            width: 60px;
            display: flex;
            justify-content: center;
        }

        .click {
            cursor: pointer;
        }

        .hide {
            display: none;
        }

    </style>

    <template>

        <div id="header">
            <div id="heading">
                <span id="backbutton">
                    <iron-icon class$="[[backclass(selected)]]" icon="arrow-back" on-tap="back"></iron-icon>
                </span>
                <span>{{translate("user_profile_label")}}</span>
            </div>
        </div>

        <div id="main">

            <ts-profile-sidebar route="{{route}}"></ts-profile-sidebar>

            <neon-animated-pages selected="{{selected}}" exit-animation="scale-down-animation" entry-animation="scale-up-animation">
                <ts-options-menu selected="{{selected}}"></ts-options-menu>
                <ts-login-option selected="{{selected}}" newinfo="{{newinfo}}" on-login="sendlogin"></ts-login-option>
                <ts-local-option selected="{{selected}}" newinfo="{{newinfo}}" on-local="sendlocal"></ts-local-option>
            </neon-animated-pages>

        </div>

    </template>

</dom-module>

<script>

    Polymer({

        is: 'ts-profile',

        behaviors: [
            Polymer.NeonAnimatableBehavior
        ],

        properties: {
            route: {
                type: String,
                value: '',
                notify: true
            },
            selected: {
                type: Number,
                value: 0
            },
            newinfo: {
                type: Object,
                value: {}
            },
            options: {
                type: Object,
                value: {},
                notify: true
            },
            animationConfig: {
                value: function () {
                    return {
                        'entry': {
                            name: 'slide-from-right-animation',
                            node: this
                        },
                        'exit': {
                            name: 'slide-right-animation',
                            node: this
                        }
                    }
                }
            }
        },

        backclass: function (selected) {
            return selected === 0 ? "hide" : "click";
        },

        back: function () {
            this.set('selected', 0);
        },

        reset: function () {
            var mythis = this;
            mythis.fire('iron-signal', {name: 'closeloading'});
            this.set('newinfo', {});
            setTimeout(function() {
                mythis.set('selected', 0);
            }, 1000);
        },

        sendlocal: function () {
            var user = this.newinfo;
            this.reset();
            this.fire('iron-signal', {name: 'updateuser', data: user});
        },

        sendlogin: function () {
            var mythis = this;
            var user = this.newinfo;

            if (!user.username || !user.password) {
                mythis.set('options', {});
                mythis.set('options.title', App.translate("incomplete_data"));
                mythis.set('options.body', App.translate("complete_fields"));
                mythis.set('options.loading', false);
                mythis.fire('iron-signal', {name: 'openloading'});
                return;
            }

            mythis.set('options', {});
            mythis.set('options.body', App.translate("verifying_login"));
            mythis.set('options.loading', true);
            mythis.fire('iron-signal', {name: 'openloading'});

            return App.userManager.login(user)
                .then(function (user) {
                    mythis.set('options.body', App.translate("login_verified"));
                    user.full_name = user.full_name === '' ? user.username : user.full_name;
                    setTimeout(function() {
                        mythis.reset();
                        mythis.fire('iron-signal', {name: 'updateuser', data: user});
                    }, 500);
                })
                .catch(function (err) {
                    var errmessage = App.translate("login_error");
                    if (err.syscall === "getaddrinfo") {
                        errmessage = App.translate("connection_error");
                    } else if (err.status === 404) {
                        errmessage = App.translate("bad_user");
                    } else if (err.status === 401) {
                        errmessage = App.translate("bad_password");
                    }
                    mythis.set('options.title', App.translate("login_failed"));
                    mythis.set('options.body', errmessage);
                    mythis.set('options.loading', false);
                    mythis.set('newinfo', {});
                });
        },

        translate: App.translate,

        ready: function() {
        }

    });

</script>
