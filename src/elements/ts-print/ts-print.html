
<link rel="import" href="../../components/neon-animation/neon-animation.html">
<link rel="import" href="../../components/marked-element/marked-element.html">
<link rel="import" href="../../components/paper-button/paper-button.html">

<dom-module id="ts-print">

    <style>

        :host {
            display: flex;
            flex-direction: column;
        }

        #header {
            background-color: var(--primary-color);
            min-height: 50px;
        }

        #header iron-icon {
            margin: 0 15px;
        }

        #heading {
            font-size: 125%;
            color: var(--reverse-text-color);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 45px;
        }

        .click {
            cursor: pointer;
        }

        #content {
            margin: 25px auto;
            padding: 0 50px;
            max-width: 730px;
            overflow-y: auto;
            background-color: var(--card-background-color);
        }

        .button {
            background: var(--accent-color);
            color: var(--reverse-text-color);
            text-transform: uppercase;
            padding: 6px;
            margin-left: 50px;
            font-size: 80%;
        }

        h1, h2 {
            text-align: center;
        }

        .centered {
            text-align: center;
        }

        .hide {
            display: none;
        }

        .break {
            margin-bottom: 50px;
            padding-bottom: 50px;
            border-bottom: 1px dashed var(--secondary-text-color);
        }

        .obs #notices- {
            margin-top: 50px;
            padding-top: 50px;
            border-top: 1px dashed var(--secondary-text-color);
        }

        .titles {
            margin-top: 50px;
        }

        .justify, .justify * {
            text-align: justify;
        }

        .double, .double * {
            line-height: 190%;
        }

        .nobreak p {
            margin: 0 0 30px;
        }

        #license a {
            text-decoration: none;
        }

        #attrib {
            font-size: 80%;
            margin: 0 20px;
        }

        .paragraph {
            position: relative;
            margin-bottom: 0.5em;
            min-height: 1.6em;
        }

        .spacer {
            height: 1.6em;
        }

        .verse-num {
            font-size: 0.8em;
            vertical-align: super;
            margin-right: 1px;
            color: var(--secondary-text-color);
            font-weight: bold;
        }

        .verse-num-abs {
            position: absolute;
            top: 0;
            font-weight: bold;
        }
        [dir="ltr"] .verse-num-abs {
            left: 0;
        }
        [dir="rtl"] .verse-num-abs {
            right: 0;
        }

        .align-start  { text-align: start; }
        .align-center { text-align: center !important; } /* to override justify rule */
        .align-end    { text-align: end; }

        [dir="ltr"] .indent-0 { padding-left: 0; }
        [dir="ltr"] .indent-1 { padding-left: 20px; }
        [dir="ltr"] .indent-2 { padding-left: 40px; }
        [dir="ltr"] .indent-3 { padding-left: 60px; }

        [dir="rtl"] .indent-0 { padding-right: 0; }
        [dir="rtl"] .indent-1 { padding-right: 20px; }
        [dir="rtl"] .indent-2 { padding-right: 40px; }
        [dir="rtl"] .indent-3 { padding-right: 60px; }

        .footnote-caller-link {
            color: var(--accent-color-dark);
            text-decoration: none;
        }

        .footnote-caller-link sup {
            text-decoration: underline;
            margin-left: 1px;
        }

        .footnote-caller-link,
        .footnote-back-link {
            display: inline-block;
            padding-top: 100px;
            margin-top: -100px;
        }

        .footnote-caller-target {
            font-weight: bold;
        }

        .footnotes {
            margin-top: 20px;
            padding: 20px 0;
            border-top: 1px solid var(--primary-text-color);
            border-bottom: 1px solid var(--primary-text-color);
            page-break-before: auto;
        }

    </style>

    <template>

        <div id="header">
            <div id="heading">
                <iron-icon class="click" icon="arrow-back" on-tap="goback"></iron-icon>
                <span class="click" on-tap="goback">[[createtitle(backto)]]</span>
                <iron-icon icon="chevron-right"></iron-icon>
                <span>{{translate("print_preview_title")}}</span>
                <paper-button raised class="button" on-tap="print">{{translate("save_pdf")}}</paper-button>
                <span id="attrib">{{princeLink()}}</span>
            </div>
        </div>
        <div id="content">
            <h1 id="resource" class="titles targetfont"></h1>
            <h1 id="title" class="break targetfont"></h1>
            <div id="license" class="break">
                <marked-element id="licenseholder">
                    <div class="markdown-html"></div>
                </marked-element>
            </div>
            <div id="textholder" class="targetfont targetsize" dir="{{currentproject.projectmeta.target_language.direction}}"></div>
        </div>

    </template>

</dom-module>

<script>

    Polymer({

        is: 'ts-print',

        behaviors: [
            Polymer.NeonAnimatableBehavior
        ],

        properties: {
            route: {
                type: String,
                notify: true,
                observer: 'load'
            },
            backto: {
                type: String,
                value: ''
            },
            options: {
                type: Object,
                value: {},
                notify: true
            },
            currentproject: {
                type: Object,
                value: {}
            },
            animationConfig: {
                value: function () {
                    return {
                        'entry': {
                            name: 'slide-from-right-animation',
                            node: this
                        },
                        'exit': {
                            name: 'slide-right-animation',
                            node: this
                        }
                    }
                }
            }
        },

        rendertext: function () {
            const chunks = this.currentproject.chunks;
            const options = this.currentproject.printoptions;
            const book = chunks[0].transcontent || chunks[0].srccontent;
            const resource = chunks[0].projectmeta.target_language.name + ": " + chunks[0].projectmeta.resource.name;
            const pagetitle = chunks[0].projectmeta.target_language.name + " - " + book;

            this.$.licenseholder.markdown = App.printManager.getLicense("LICENSE.md");
            this.$.resource.textContent = resource;
            this.$.title.textContent = book;
            this.$.textholder.innerHTML = App.renderer.renderPrintPreview(chunks, options, pagetitle);
        },

        createtitle: function (backto) {
            if (backto === "translate") {
                return this.translate("project");
            } else if (backto === "review") {
                return this.translate("review");
            } else {
                return this.translate("home");
            }
        },

        load: function () {
            if (this.route === "preview") {
                const links = this.getElementsByTagName('a');

                for (let i = 0; i < links.length; i++) {
                    links[i].addEventListener('click', this.externalClick);
                }

                this.set('backto', App.configurator.getValue("backto"));
            }
        },

        externalClick: function (event) {
            const shell = require('electron').shell;

            event.preventDefault();
            shell.openExternal(this.href);
        },

        goback: function () {
            const mythis = this;
            const backto = this.backto;

            mythis.$.content.scrollTop = 0;
            mythis.set('route', backto);

            setTimeout(function() {
                if (backto === "translate") {
                    mythis.fire('iron-signal', {name: 'translateright'});
                }
                if (backto === "review") {
                    mythis.fire('iron-signal', {name: 'reviewright'});
                }
            }, 500);
        },

        print: function () {
            const mythis = this;
            const name = this.currentproject.projectmeta.unique_id;
            const defaultPath = App.configurator.getUserPath('datalocation', name);
            const direction = this.currentproject.projectmeta.target_language.direction;
            const filePath = App.ipc.sendSync('save-as', {
                options: {
                    defaultPath: defaultPath,
                    filters: [{
                        name: 'PDF Files',
                        extensions: ['pdf']
                    }]
                }
            });
            if (!filePath) {
                return;
            }

            mythis.set('options', {});
            mythis.set('options.body', mythis.translate("creating_pdf_status"));
            mythis.set('options.loading', true);
            mythis.fire('iron-signal', {name: 'openloading'});

            const resource = mythis.$.resource.innerHTML;
            const title = mythis.$.title.innerHTML;
            const license = mythis.$.license.innerHTML;
            const body = mythis.$.textholder.innerHTML;

            setTimeout(function() {
                return App.printManager.savePdf(resource, title, license, body, filePath, direction)
                    .then(function () {
                        mythis.set('options.title', mythis.translate("pdf_created"));
                        mythis.set('options.body', mythis.translate("project_saved_pdf"));
                        mythis.set('options.loading', false);
                        mythis.goback();
                    })
                    .catch(function (err) {
                        let errmessage = mythis.translate("save_project_error");
                        if(err !== null) {
                            errmessage = err;
                        }
                        mythis.set('options.title', mythis.translate("print_failed"));
                        mythis.set('options.body', errmessage);
                        mythis.set('options.loading', false);
                    });
            }, 500);
        },

        translate: function (key, ...args) {
            return App.locale.translate(key, ...args);
        },

        princeLink: function () {
            const translated = this.translate("pdf_generated_by", '<a href="https://www.princexml.com/">Prince</a>');
            this.$.attrib.innerHTML = `(${translated})`;
        },

        ready: function () {
            document.addEventListener('click', function(event) {
                const downwardLink = event.target.closest('a.footnote-caller-link');
                const upwardLink = event.target.closest('a.footnote-back-link');
                const activeLink = downwardLink || upwardLink;

                if (activeLink) {
                    event.preventDefault();
                    event.stopPropagation();

                    const targetId = activeLink.getAttribute('href').substring(1);
                    const targetElement = document.getElementById(targetId);

                    if (targetElement) {
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }, true);
        }

    });

</script>
