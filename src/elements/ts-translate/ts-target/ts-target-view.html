
<link rel="import" href="../../../components/paper-material/paper-material.html">
<link rel="import" href="../../../components/iron-signals/iron-signals.html">

<link rel="import" href="../ts-source/ts-note-marker.html">

<dom-module id="ts-target-view">

	<style>

        :host {
            flex: auto;
            display: flex;
        }

        paper-material {
            flex: auto;
            display: flex;
            background: var(--card-background-color);
            flex-direction: column;
            border-radius: 3px;
        }

		#heading {
            color: var(--secondary-text-color);
            display: flex;
            justify-content: flex-start;
            min-height: 42px;
            align-items: flex-end;
            font-size: 88%;
            font-weight: 300;
            border-bottom: 1px solid var(--note-card-pink);
            margin-bottom: 4px;
            letter-spacing: 1px;
            padding: 5px 25px;
		}

        #content {
			padding: 0 10%;
            flex: auto;
		}

        #textholder {
            width: 100%;
            margin-top: 30px;
        }

        #textholder p {
			line-height: 2;
            margin: 0;
            color: var(--primary-text-color);
		}

        #conflict {
            flex: auto;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .review {
            background: var(--review-color);
            color: var(--reverse-text-color);
            text-transform: uppercase;
            font-size: 90%;
        }

        .rtl {
            direction: rtl;
        }

        .hide {
            display: none;
        }

        .flex {
            display: flex;
        }

        .poetry-1 {
            padding-left: 20px;
        }

        .poetry-2 {
            padding-left: 40px;
        }

        .poetry-3 {
            padding-left: 60px;
        }

        .poetry-4 {
            padding-left: 80px;
        }

        .poetry-5 {
            padding-left: 100px;
        }

        .poetry-6 {
            padding-left: 120px;
        }

        .poetry-s, .poetry-r {
            text-align: end;
        }

        .poetry-a, .poetry-c, .poetry-d, *[class*="poetry-m"] {
            text-align: center;
        }

        .poetry-a, .poetry-ac, .poetry-d, *[class*="poetry-m"] {
            font-style: italic;
        }

	</style>

	<template>

        <paper-material elevation="1">
            <div id="heading">
                <div>
                    <span>[[chunk.chaptermeta.chapterref]]</span><span>[[chunk.chaptermeta.refaddon]]</span>
                </div>
            </div>
            <div id="content" class$="[[noconflictclass(chunk.conflicts)]]">
                <div id="textholder" class$="[[chunk.projectmeta.target_language.direction]]"></div>
            </div>
            <div id="conflict" class$="[[conflictclass(chunk.conflicts)]]">
                <paper-button raised class="review" on-tap="gotoreview">{{translate("conflict_exists")}}</paper-button>
            </div>
        </paper-material>

	</template>

</dom-module>

<script>

	Polymer({

		is: 'ts-target-view',

		properties: {
            chunk: {
                type: Object,
                value: {}
            }
		},

        observers: [
            'rendertext(chunk.transcontent)'
        ],

        rendertext: function () {
            if(this.chunk && this.chunk.srccontent && this.chunk.projectmeta.project_type_class === "standard") {
                const text = this.chunk.transcontent;
                const module = "ts-target-view";

                let result = App.renderer.markersToFootnotes(text, this.chunk.index, true);
                result = App.renderer.renderTargetWithVerses(result, module);
                this.$.textholder.innerHTML = result;
            }
        },

        gotoreview: function () {
            const index = -1;
            const chapter = this.chunk.chaptermeta.chapter;
            this.fire('iron-signal', {name: 'gotoreview', data: {index: index, chapter: chapter}});
        },

        conflictclass: function (exists) {
            return exists ? 'flex' : 'hide';
        },

        noconflictclass: function (exists) {
            return exists ? 'hide' : 'flex targetfont targetsize';
        },

        translate: function (key, ...args) {
            return App.locale.translate(key, ...args);
        },

		ready: function() {
		}

	});

</script>
