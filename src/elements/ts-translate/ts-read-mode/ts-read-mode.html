
<link rel="import" href="../../../components/iron-list/iron-list.html">

<link rel="import" href="./ts-read-card.html">

<dom-module id="ts-read-mode">

    <style>

        :host {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            display: flex;
        }

        #contain {
            flex: auto;
        }

        #readlist {
            max-height: calc(100vh - 70px);
        }

        ::-webkit-scrollbar {
            display: none;
        }

        :host(.preview) {
            opacity: 0;
        }

        :host(.hide) {
            visibility: hidden;
        }

        .movein {
            -webkit-animation: moveinto .5s;
        }

        .moveout {
            -webkit-animation: moveout .5s;
        }

        @-webkit-keyframes moveinto {
            0% {transform: scale(0,0); opacity: 0}
            100% {transform: scale(1,1); opacity: 1}
        }

        @-webkit-keyframes moveout {
            0% {transform: scale(1,1); opacity: 1}
            100% {transform: scale(0,0); opacity: 0}
        }

        :host::shadow #items {
            margin-bottom: 300px;
        }

    </style>

    <template>

        <div id="contain">
            <iron-list id="readlist" items="{{chapters}}" as="chunk" on-scroll="refresh">
                <template>
                    <ts-read-card id="{{createid(index)}}" chunk="[[chunk]]"></ts-read-card>
                </template>
            </iron-list>
        </div>

    </template>

</dom-module>

<script>

    Polymer({

        is: 'ts-read-mode',

        behaviors: [
            Polymer.IronResizableBehavior
        ],

        properties: {
            chapters: {
                type: Array,
                value: []
            },
            modestatus: {
                type: Object,
                value: {},
                notify: true
            },
            modename: {
                type: String,
                value: "read"
            },
            active: {
                type: Boolean,
                value: false
            }
        },

        refresh: function () {
            const mythis = this;

            if (mythis.active) {
                mythis.getlocation();
                this.async(() => {
                    mythis.setheights();
                }, 1);
            }
        },

        setheights: function () {
            const list = this.$.readlist;
            list.fire('iron-resize');

            for (let i = list.firstVisibleIndex; i <= list.lastVisibleIndex; i++) {
                const card = document.getElementById(this.modename + i);
                if (card && this.chapters && i < this.chapters.length) {
                    card.setheight();
                    list.updateSizeForItem(i);
                }
            }
        },

        frommode: function () {
            this.set('active', false);
            this.getlocation();
            this.moveout();
        },

        tomode: function () {
            this.set('active', true);
            this.setpreview();
            this.setheights();
            this.movein();
        },

        moveout: function () {
            const mythis = this;
            const contain = this.$.contain;

            contain.classList.add("moveout");
            setTimeout(function() {
                mythis.classList.add("hide");
                setTimeout(function() {
                    contain.classList.remove("moveout");
                }, 300);
            }, 300);
        },

        movein: function () {
            const mythis = this;
            const contain = this.$.contain;

            setTimeout(function() {
                mythis.classList.remove("preview");
                contain.classList.add("movein");
                setTimeout(function() {
                    contain.classList.remove("movein");
                    mythis.setheights();
                    mythis.setlocation();
                    mythis.fire('iron-signal', {name: 'closeloading'});
                }, 300);
            }, 300);
        },

        setpreview: function () {
            this.classList.add("preview");
            this.classList.remove("hide");
        },

        getlocation: function () {
            const index = this.getCenteredIndex();
            const chapters = this.chapters;

            if (chapters && chapters.length) {
                this.set('modestatus.chapter', chapters[index].chaptermeta.chapter);
                this.set('modestatus.index', -1);
            }
        },

        setlocation: function () {
            const index = (parseInt(this.modestatus.chapter) || 1) - 1;
            this.async(() => {
                this.$.readlist.scrollToIndex(index);
            }, 1);
        },

        createid: function (index) {
            return this.modename + index;
        },

        getCenteredIndex: function () {
            const list = this.$.readlist;
            const listRect = list.getBoundingClientRect();

            let maxVisibleHeight = 0;
            let mostVisibleItem = null;

            // iron-list maintains a set of 'physical' elements currently in DOM
            list._physicalItems.forEach(item => {
                const rect = item.getBoundingClientRect();

                // Calculate the overlap between the item and the list viewport
                const visibleTop = Math.max(rect.top, listRect.top);
                const visibleBottom = Math.min(rect.bottom, listRect.bottom);
                const visibleHeight = visibleBottom - visibleTop;

                if (visibleHeight > maxVisibleHeight) {
                    maxVisibleHeight = visibleHeight;
                    mostVisibleItem = item;
                }
            });

            if (mostVisibleItem) {
                // Use iron-list's internal method to map the element back to the data index
                return list.modelForElement(mostVisibleItem).index;
            }

            return list.firstVisibleIndex;
        },

        ready: function() {

        }

    });

</script>
