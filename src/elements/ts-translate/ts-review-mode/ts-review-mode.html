
<link rel="import" href="../../../components/iron-list/iron-list.html">

<link rel="import" href="./ts-review-card.html">
<link rel="import" href="./ts-search-bar.html">

<dom-module id="ts-review-mode">

	<style>

		:host {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            display: flex;
        }

        #contain {
            flex: auto;
        }

        #searchbar.hide {
            display: none;
        }

        #reviewlist {
            max-height: calc(100vh - 70px);
        }

        #reviewlist.searchmode {
            max-height: calc(100vh - 120px);
        }

        ::-webkit-scrollbar {
            width: 0;
        }

        :host(.preview) {
            opacity: 0;
        }

        :host(.hide) {
            visibility: hidden;
        }

        .movein {
            -webkit-animation: moveinto .3s;
        }

        .moveout {
            -webkit-animation: moveout .3s;
        }

        @-webkit-keyframes moveinto {
            0% {transform: scale(0,0); opacity: 0}
            100% {transform: scale(1,1); opacity: 1}
        }

        @-webkit-keyframes moveout {
            0% {transform: scale(1,1); opacity: 1}
            100% {transform: scale(0,0); opacity: 0}
        }

        :host::shadow #items {
            margin-bottom: 300px;
        }

	</style>

	<template>

        <div id="contain">
            <ts-search-bar id="searchbar" class="hide" chunks="[[chunks]]" searchoptions="{{searchoptions}}" results="{{results}}" on-hidesearch="hidesearch" on-next="next" on-previous="previous"></ts-search-bar>
            <iron-list id="reviewlist" items="{{chunks}}" as="chunk" on-scroll="refresh">
                <template>
                    <ts-review-card chunk="{{chunk}}" searchoptions="{{searchoptions}}" on-setheights="setheights"></ts-review-card>
                </template>
            </iron-list>
        </div>

	</template>

</dom-module>

<script>

	Polymer({

		is: 'ts-review-mode',

        behaviors: [
            Polymer.IronResizableBehavior
        ],

        properties: {
            chunks: {
                type: Array,
                value: [],
                notify: true
            },
            searchoptions: {
                type: Object,
                value: {}
            },
            modestatus: {
                type: Object,
                value: {},
                notify: true
            },
            results: {
                type: Object,
                value: {}
            },
            timer: {
                type: Number
            },
            active: {
                type: Boolean,
                value: false
            },
            scrollTicking: {
                type: Boolean,
            }
        },

        opensearch: function () {
            const mythis = this;

            this.$.reviewlist.classList.add('searchmode');
            this.$.searchbar.classList.remove('hide');

            setTimeout(function() {
                mythis.$.searchbar.focussearch();
            }, 500);
        },

        closesearch: function () {
            this.hidesearch();
            this.$.searchbar.clearsearch();
        },

        hidesearch: function () {
            this.$.reviewlist.classList.remove('searchmode');
            this.$.searchbar.classList.add('hide');
        },

        next: function () {
            const list = this.$.reviewlist;
            const index = list.firstVisibleIndex || 0;
            const order = this.results.forward;

            const next = order.find(function (num) {
                return num > index;
            });

            list.scrollToIndex(next);
        },

        previous: function () {
            const list = this.$.reviewlist;
            const index = list.firstVisibleIndex || 0;
            const order = this.results.backward;

            const previous = order.find(function (num) {
                return num < index;
            });

            list.scrollToIndex(previous);
        },

        refresh: function () {
            const mythis = this;

            if (this.active) {
                if (!this.scrollTicking) {
                    window.requestAnimationFrame(() => {
                        mythis.getlocation();
                        this.scrollTicking = false;
                    });
                    this.scrollTicking = true;
                }

                this.cancelAsync(this.timer);
                this.timer = this.async(() => {
                    mythis.setheights();
                    mythis.fire('iron-signal', {name: 'passivesearch'});
                }, 1);
            }
        },

        setheights: function () {
            const list = this.$.reviewlist;

            list.fire('iron-resize');

            for (let i = list.firstVisibleIndex; i <= list.lastVisibleIndex; i++) {
                if (this.chunks && this.chunks.length && i < this.chunks.length) {
                    list.updateSizeForItem(i);
                }
            }
        },

        frommode: function () {
            this.set('active', false);
            this.getlocation();
            this.moveout();
        },

        tomode: function () {
            this.set('active', true);
            this.setpreview();
            this.setheights();
            this.movein();
        },

        moveout: function () {
            const mythis = this;
            const contain = this.$.contain;

            contain.classList.add("moveout");
            setTimeout(function() {
                mythis.classList.add("hide");
                setTimeout(function() {
                    contain.classList.remove("moveout");
                }, 300);
            }, 300);
        },

        movein: function () {
            const mythis = this;
            const contain = this.$.contain;

            setTimeout(function() {
                mythis.classList.remove("preview");
                contain.classList.add("movein");
                setTimeout(function() {
                    contain.classList.remove("movein");
                    mythis.setheights();
                    mythis.setlocation();
                    mythis.fire('iron-signal', {name: 'closeloading'});
                }, 300);
            }, 300);
        },

        setpreview: function () {
            this.classList.add("preview");
            this.classList.remove("hide");
        },

        getlocation: function () {
            const index = this.getTopVisibleIndex();
            const chunks = this.chunks;
            let chapter;

            if (chunks && chunks.length) {
                const chunk = chunks[index];
                const type = chunk.projectmeta.type.id;

                if (type === "tw") {
                    chapter = chunk.chunkmeta.frameid.charAt(0).toUpperCase();
                } else {
                    chapter = chunk.chunkmeta.chapter;
                }

                this.set('modestatus.chapter', chapter);
                this.set('modestatus.index', index);
            }
        },

        setlocation: function () {
            let index = parseInt(this.modestatus.index) || 0;
            const chunks = this.chunks;
            const chapter = this.modestatus.chapter;

            if (index < 0) {
                const filtered = chunks.filter(function (chunk) {
                    return chunk.chunkmeta.chapter === chapter;
                });
                if (filtered.length) {
                    index = filtered[0].index;
                } else {
                    index = chunks.length - 1;
                }
            }

            this.async(() => {
                this.$.reviewlist.scrollToIndex(index);
            }, 1);
        },

        getTopVisibleIndex: function () {
            const list = this.$.reviewlist;
            const listRect = list.getBoundingClientRect();

            // We look 20 pixels down from the top of the list to ignore small overlaps
            const checkPoint = listRect.top + 20;

            const items = list.querySelectorAll('ts-review-card');
            let index = list.firstVisibleIndex || 0;

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const rect = item.getBoundingClientRect();

                // If this card covers the point 20px from the top, it's our winner
                if (checkPoint >= rect.top && checkPoint <= rect.bottom) {
                    const model = list.modelForElement(item);
                    if (model) {
                        index = model.index;
                        break;
                    }
                }
            }

            return index;
        },

		ready: function() {

		}

	});

</script>
