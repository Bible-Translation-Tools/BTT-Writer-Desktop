
<link rel="import" href="../../components/iron-signals/iron-signals.html">
<link rel="import" href="../../components/paper-dialog/paper-dialog.html">
<link rel="import" href="../../components/paper-button/paper-button.html">
<link rel="import" href="../../components/neon-animation/neon-animation.html">
<link rel="import" href="../../components/paper-checkbox/paper-checkbox.html">

<link rel="import" href="./ts-read-mode/ts-read-mode.html">
<link rel="import" href="./ts-chunk-mode/ts-chunk-mode.html">
<link rel="import" href="./ts-review-mode/ts-review-mode.html">
<link rel="import" href="./ts-conflict-mode/ts-conflict-mode.html">
<link rel="import" href="./ts-translate-sidebar.html">
<link rel="import" href="./ts-nosource-mode.html">
<link rel="import" href="./ts-source/ts-source-modal.html">
<link rel="import" href="./ts-resource/ts-resource-display.html">

<dom-module id="ts-translate">

    <style>

        :host {
            display: flex;
        }

        #pages {
            flex: auto;
            display: flex;
            position: relative;
        }

        .popup {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            background-color: var(--popup-background-color);
            width: fit-content;
            height: fit-content;
            max-width: 750px;
            max-height: 550px;
            padding: 10px;
        }

        .checklistpopup {
            text-align: center;
            color: var(--primary-text-color);
        }

        .checklistpopup p {
            margin: 0;
        }

        .checklistpopup p.spaced {
            margin-bottom: 15px;
        }

        .checklistpopup .buttons {
            display: flex;
            justify-content: center;
            color: var(--secondary-text-color);
            gap: 20px;
        }

        .checklistpopup .buttons paper-button:hover {
            color: var(--accent-color);
        }

        #editpopup {
            text-align: center;
            color: var(--primary-text-color);
        }

        #editpopup .buttons {
            display: flex;
            justify-content: center;
            color: var(--secondary-text-color);
            gap: 20px;
        }

        #editpopup .buttons paper-button:hover {
            color: var(--accent-color);
        }

        #sourcepopup {
            display: flex;
        }

        #sourcepopup * {
            margin: 0;
            padding: 0;
        }

        #nodatapopup {
            text-align: center;
            color: var(--primary-text-color);
        }

        #nodatapopup .buttons {
            display: flex;
            justify-content: center;
            color: var(--secondary-text-color);
            gap: 20px;
        }

        #nodatapopup .buttons paper-button:hover {
            color: var(--accent-color);
        }

        #note, #deletenotepopup {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #noteheader, #deletenoteheader {
            flex: 0 0 50px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            margin: 0;
            padding: 0 30px;
        }

        #notebody, #deletenotebody {
            flex: 0 0 110px;
            overflow-y: auto;
            margin: 0;
            padding: 20px 30px;
        }

        #notefooter, #deletenotefooter {
            flex: 0 0 50px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            margin: 0;
            padding: 0 50px;
            color: var(--secondary-text-color);
        }

        #notefooter paper-button:hover, #deletenotefooter paper-button:hover {
            color: var(--accent-color);
        }

        #notefooter .separator {
            flex: 1;
        }

        #noteeditor .buttons {
            display: flex;
            justify-content: flex-end;
            color: var(--secondary-text-color);
            gap: 20px;
        }

        #resourcedisplay.hide {
            visibility: hidden;
        }

        .slidein {
            -webkit-animation: slidein .5s;
        }

        .slideout {
            -webkit-animation: slideout .5s;
        }

        @-webkit-keyframes slidein {
            0% {transform: translateX(450px)}
            100% {transform: translateX(0)}
        }

        @-webkit-keyframes slideout {
            0% {transform: translateX(0)}
            100% {transform: translateX(450px)}
        }

        .nodisplay {
            display: none;
        }

        .highlight {
            background: var(--highlight-color);
        }

        .hide {
            display: none;
        }

    </style>

    <template>

        <ts-translate-sidebar selected="{{selected}}" currentproject="[[currentproject]]" modestatus="{{modestatus}}" on-navigate="navigate" on-gohome="gohome" on-goreview="goreview" on-goexport="goexport" on-goprint="goprint" on-gosearch="gosearch" on-gosettings="gosettings"></ts-translate-sidebar>

        <div id="pages">
            <ts-read-mode id="readmode" chapters="[[currentproject.chapters]]" modestatus="{{modestatus}}"></ts-read-mode>
            <ts-chunk-mode id="chunkmode" chunks="{{currentproject.chunks}}" modestatus="{{modestatus}}"></ts-chunk-mode>
            <ts-review-mode id="reviewmode" chunks="{{currentproject.chunks}}" modestatus="{{modestatus}}"></ts-review-mode>
            <ts-nosource-mode id="nosourcemode" projectmeta="[[currentproject.projectmeta]]"></ts-nosource-mode>
            <ts-conflict-mode id="conflictmode" chunks="{{currentproject.chunks}}" modestatus="{{modestatus}}"></ts-conflict-mode>
        </div>

        <ts-resource-display id="resourcedisplay" class="hide" chunks="[[currentproject.chunks]]" modestatus="{{modestatus}}" on-navigate="navigate" on-closeresource="closeresource"></ts-resource-display>

        <paper-dialog id="checklistpopup" class="checklistpopup popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
            <h2>{{translate("chunk_checklist")}}</h2>
            <div>
                <p class="spaced">{{translate("chunk_checklist_warning")}}</p>
                <p class$="[[versecheck(currentproject.projectmeta)]]">{{translate("chunk_checklist_option1")}}</p>
                <p>{{translate("chunk_checklist_option2")}}</p>
                <p class$="[[standardcheck(currentproject.projectmeta)]]">{{translate("chunk_checklist_option3")}}</p>

            </div>
            <div class="buttons">
                <paper-button dialog-dismiss>{{translate("cancel")}}</paper-button>
                <paper-button dialog-confirm on-tap="closechecklist">{{translate("confirm")}}</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="projectchecklistpopup" class="checklistpopup popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
            <h2>{{translate("project_checklist")}}</h2>
            <div>
                <p class="spaced">{{translate("project_checklist_warning")}}</p>
                <p class$="[[versecheck(currentproject.projectmeta)]]">{{translate("chunk_checklist_option1")}}</p>
                <p>{{translate("chunk_checklist_option2")}}</p>
                <p class$="[[standardcheck(currentproject.projectmeta)]]">{{translate("chunk_checklist_option3")}}</p>
            </div>
            <div class="buttons">
                <paper-button dialog-dismiss>{{translate("cancel")}}</paper-button>
                <paper-button dialog-confirm on-tap="closeprojectchecklist">{{translate("confirm")}}</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="editpopup" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
            <h2>{{translate("edit_chunk")}}</h2>
            <div>
                <p>{{translate("edit_chunk_warning")}}</p>
            </div>
            <div class="buttons">
                <paper-button dialog-dismiss>{{translate("dismiss")}}</paper-button>
                <paper-button dialog-confirm on-tap="closeedit">{{translate("edit")}}</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="nodatapopup" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
            <h2>{{translate("missing_data")}}</h2>
            <div>
                <p>{{translate("missing_data_error")}}</p>
            </div>
            <div class="buttons">
                <paper-button dialog-dismiss>{{translate("ok")}}</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="note" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
            <div id="noteheader">
                <h2>{{translate("footnote")}}</h2>
            </div>
            <div id="notebody"></div>
            <div id="notefooter">
                <paper-button dialog-confirm on-tap="editnote" class$="[[buttonclass(notestatus.target)]]">{{translate("edit")}}</paper-button>
                <div class="separator"></div>
                <paper-button dialog-confirm on-tap="deletenoteconfirm" class$="[[buttonclass(notestatus.target)]]">{{translate("delete")}}</paper-button>
                <paper-button dialog-dismiss>{{translate("dismiss")}}</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="deletenotepopup" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
            <div id="deletenoteheader">
                <h2>{{translate("delete_footnote_confirm")}}</h2>
            </div>
            <div id="deletenotebody"></div>
            <div id="deletenotefooter">
                <paper-button dialog-dismiss>{{translate("cancel")}}</paper-button>
                <paper-button dialog-confirm on-tap="deletenote">{{translate("delete")}}</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="noteeditor" class="noteeditor popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
            <h2>{{translate("add_footnote")}}</h2>
            <div>
                <iron-autogrow-textarea id="notetext" placeholder="{{translate('enter_footnote')}}" autofocus></iron-autogrow-textarea>
            </div>
            <div class="buttons">
                <paper-button dialog-dismiss on-tap="cancelnote">{{translate("cancel")}}</paper-button>
                <paper-button dialog-confirm on-tap="savenote">{{translate("ok")}}</paper-button>
            </div>
        </paper-dialog>

        <paper-dialog id="sourcepopup" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
            <ts-source-modal id="modal" on-close="closesource" on-gohome="gohome" options="{{options}}"></ts-source-modal>
        </paper-dialog>

        <iron-signals on-iron-signal-fromreview="fromreview"></iron-signals>
        <iron-signals on-iron-signal-updatesources="updatesources"></iron-signals>
        <iron-signals on-iron-signal-loadproject="loadProject"></iron-signals>
        <iron-signals on-iron-signal-updatecompletion="updatecompletion"></iron-signals>
        <iron-signals on-iron-signal-openchecklist="openchecklist"></iron-signals>
        <iron-signals on-iron-signal-openedit="openedit"></iron-signals>
        <iron-signals on-iron-signal-opennodata="opennodata"></iron-signals>
        <iron-signals on-iron-signal-opennote="opennote"></iron-signals>
        <iron-signals on-iron-signal-opennoteeditor="opennoteeditor"></iron-signals>
        <iron-signals on-iron-signal-opensource="opensource"></iron-signals>
        <iron-signals on-iron-signal-savechunk="savechunk"></iron-signals>
        <iron-signals on-iron-signal-savemanifest="savemanifest"></iron-signals>
        <iron-signals on-iron-signal-updatestate="updatestate"></iron-signals>
        <iron-signals on-iron-signal-savestate="savestate"></iron-signals>
        <iron-signals on-iron-signal-reset="reset"></iron-signals>
        <iron-signals on-iron-signal-saveclose="saveAndClose"></iron-signals>
        <iron-signals on-iron-signal-saveall="saveAll"></iron-signals>
        <iron-signals on-iron-signal-writechunk="writeChunk"></iron-signals>
        <iron-signals on-iron-signal-gotoreview="goToReview"></iron-signals>
        <iron-signals on-iron-signal-resolveconflict="resolveConflict"></iron-signals>
        <iron-signals on-iron-signal-translateright="setrightanimation"></iron-signals>
        <iron-signals on-iron-signal-translateleft="setleftanimation"></iron-signals>
        <iron-signals on-iron-signal-openresource="openresource"></iron-signals>
        <iron-signals on-iron-signal-openprojectchecklist="openprojectchecklist"></iron-signals>

    </template>

</dom-module>

<script>

    Polymer({

        is: 'ts-translate',

        behaviors: [
            Polymer.IronResizableBehavior,
            Polymer.NeonAnimatableBehavior
        ],

        properties: {
            selected: {
                type: Number,
                value: 0,
                observer: 'modechange'
            },
            route: {
                type: String,
                value: '',
                notify: true,
                observer: 'load'
            },
            projectlist: {
                type: Array,
                value: []
            },
            currentproject: {
                type: Object,
                value: {},
                notify: true
            },
            currentuser: {
                type: Object,
                value: {}
            },
            modestatus: {
                type: Object,
                value: {}
            },
            options: {
                type: Object,
                value: {},
                notify: true
            },
            saveoptions: {
                type: Object,
                value: {chunks: [], manifest: false, backup: false}
            },
            savetimer: {
                type: Number
            },
            backuptimer: {
                type: Number
            },
            message: {
                type: String,
                value: "Idle",
                notify: true
            },
            notestatus: {
                type: Object,
                value: {}
            },
            animationConfig: {
                value: function () {
                    return {
                        'entry': {
                            name: 'slide-from-right-animation',
                            node: this
                        },
                        'exit': {
                            name: 'slide-right-animation',
                            node: this
                        }
                    }
                }
            },
            cmdKeyDown: {
                type: Boolean,
                value: false
            }
        },

        starttimers: function () {
            var mythis = this;

            clearTimeout(mythis.savetimer);
            clearTimeout(mythis.backuptimer);

            mythis.savetimer = setTimeout(function timer1 () {
                mythis.saveAll();
                mythis.savetimer = setTimeout(timer1, 120000);
            }, 100);

            mythis.backuptimer = setTimeout(function timer2 () {
                mythis.set('saveoptions.backup', true);
                mythis.backuptimer = setTimeout(timer2, 590000);
            }, 100);
        },

        stoptimers: function () {
            clearTimeout(this.savetimer);
            clearTimeout(this.backuptimer);
        },

        goToReview: function (event, data) {
            this.set('selected', 0);
            this.set('modestatus.index', data.index);
            this.set('modestatus.chapter', data.chapter);
            this.set('selected', 3);
        },

        saveAndClose: function () {
            if (this.route === "translate") {
                this.savestate();
                this.stoptimers();
                return this.saveAll()
                    .then(function () {
                        App.close();
                    });
            } else {
                App.close();
            }
        },

        saveAll: function () {
            const myThis = this;
            const projectMeta = myThis.currentproject.projectmeta;
            const allChunks = myThis.currentproject.chunks;
            let changes = false;
            const saveChunks = myThis.saveoptions.chunks;

            const saveChunk = function (data) {
                const chunk = allChunks[data];
                return App.projectsManager.saveTargetChunk(chunk, projectMeta)
                    .catch(function (err) {
                        App.reporter.logError(err, App.translate("saving_chunk_error"));
                    });
            };

            myThis.set('message', App.translate("checking_changes"));

            return Promise.resolve(true)
                .then(function () {
                    if (saveChunks.length) {
                        changes = true;
                        myThis.addcontributor();
                        return Promise.all(_.map(saveChunks, saveChunk))
                            .then(function () {
                                myThis.set('saveoptions.chunks', []);
                                return App.projectsManager.cleanProject(allChunks, projectMeta)
                                    .catch(function (err) {
                                        App.reporter.logError(err, App.translate("clean_project_error"));
                                    });
                            });
                    } else {
                        return Promise.resolve(true);
                    }
                })
                .then(function () {
                    if (myThis.saveoptions.manifest) {
                        changes = true;
                        return App.projectsManager.saveTargetManifest(projectMeta)
                            .then(function () {
                                myThis.set('saveoptions.manifest', false);
                                return Promise.resolve(true);
                            })
                            .catch(function (err) {
                                App.reporter.logError(err, App.translate("save_manifest_error"));
                            });
                    } else {
                        return Promise.resolve(true);
                    }
                })
                .then(function () {
                    if (changes) {
                        return App.projectsManager.commitProject(projectMeta, myThis.currentuser)
                            .catch(function (err) {
                                App.reporter.logError(err, App.translate("commit_project_error"));
                            });
                    } else {
                        return Promise.resolve(true);
                    }
                })
                .then(function () {
                    if (myThis.saveoptions.backup) {
                        return App.exportManager.autoBackupTranslation(projectMeta)
                            .then(function () {
                                myThis.set('saveoptions.backup', false);
                                return Promise.resolve(true);
                            })
                            .catch(function (err) {
                                let errorMessage = err.data?.message || err.message || err.stderr || App.translate("backup_translation_error");
                                if (typeof err !== "string") {
                                    errorMessage = JSON.stringify(errorMessage, null, 2);
                                }
                                myThis.set('options', {});
                                myThis.set('options.title', App.translate("autobackup_failed"));
                                myThis.set('options.body', errorMessage);
                                myThis.set('options.loading', false);
                                myThis.fire('iron-signal', {name: 'openloading'});
                                myThis.set('saveoptions.backup', false);
                                App.reporter.logError(err, App.translate("backup_translation_error"));
                            });
                    } else {
                        return Promise.resolve(true);
                    }
                })
                .then(function () {
                    if (changes) {
                        myThis.set('message', App.translate("changes_saved"));
                    } else {
                        myThis.set('message', App.translate("no_changes_found"));
                    }
                    return Promise.resolve(true);
                })
                .then(function () {
                    setTimeout(function() {
                        myThis.set('message', App.translate("idle"));
                    }, 1000);
                    return Promise.resolve(true);
                });

        },

        versecheck: function (data) {
            return data && data.project_type_class === "standard" && data.project.id !== "obs" ? '' : 'nodisplay';
        },

        standardcheck: function (data) {
            return data && data.project_type_class === "standard" ? '' : 'nodisplay';
        },

        opennodata: function () {
            this.$.nodatapopup.open();
        },

        opennote: function (event, data) {
            this.set("notestatus", {
                chunkindex: data.chunkindex,
                noteindex: data.noteindex,
                target: data.target || false,
                text: data.text,
            });

            this.$.note.open();
            this.$.notebody.innerHTML = data.text;
        },

        opennoteeditor: function (event, data) {
            this.$.noteeditor.open();
            this.$.notetext.value = data?.text || "";
        },

        savenote: function () {
            const mythis = this;
            const noteText = (mythis.$.notetext.value || "").trim();
            if (noteText !== "") {
                mythis.fire('iron-signal', {
                    name: 'onsavenote',
                    data: {
                        text: noteText,
                        chunkindex: mythis.notestatus?.chunkindex,
                        noteindex: mythis.notestatus?.noteindex,
                    }
                });
                mythis.$.notetext.value = "";
                mythis.set("notestatus", null);
            }
        },

        editnote: function () {
            const mythis = this;

            if (mythis.notestatus) {
                mythis.fire('iron-signal', {
                    name: 'opennoteeditor',
                    data: {
                        text: mythis.notestatus.text
                    }
                });
            } else {
                const title = App.translate("footnote_error");
                const message = App.translate("footnote_status_lost");
                mythis.fire('iron-signal', {name: 'showmessage', data: {title, message}});
            }
        },

        deletenoteconfirm: function () {
            if (this.notestatus) {
                this.$.deletenotepopup.open();
                this.$.deletenotebody.innerHTML = this.notestatus.text;
            } else {
                const title = App.translate("footnote_error");
                const message = App.translate("footnote_status_lost");
                this.fire('iron-signal', {name: 'showmessage', data: {title, message}});
            }
        },

        deletenote: function () {
            const mythis = this;

            if (mythis.notestatus) {
                mythis.fire('iron-signal', {
                    name: 'ondeletenote',
                    data: {
                        chunkindex: mythis.notestatus.chunkindex,
                        noteindex: mythis.notestatus.noteindex,
                    }
                });
                mythis.set("notestatus", null);
            } else {
                const title = App.translate("footnote_error");
                const message = App.translate("footnote_status_lost");
                mythis.fire('iron-signal', {name: 'showmessage', data: {title, message}});
            }
        },

        cancelnote: function () {
            this.fire('iron-signal', {name: 'oncancelnote'});
            this.set("notestatus", null);
        },

        openchecklist: function (event, data) {
            this.modestatus.index = data.index;
            this.$.checklistpopup.open();
        },

        closechecklist: function () {
            var index = this.modestatus.index;
            this.fire('iron-signal', {name: 'completechunk', data: {index: index}});
        },

        openprojectchecklist: function () {
            this.$.projectchecklistpopup.open();
        },

        closeprojectchecklist: function () {
            this.markchunksdone();
        },

        openedit: function (event, data) {
            this.modestatus.index = data.index;
            this.$.editpopup.open();
        },

        opensource: function () {
            var mythis = this;
            var projectmeta = this.currentproject.projectmeta;
            var modal = this.$.modal;

            mythis.set('options', {});
            mythis.set('options.body', App.translate("loading_source_message"));
            mythis.set('options.loading', true);
            mythis.fire('iron-signal', {name: 'openloading'});
            mythis.savestate();

            setTimeout(function() {
                return App.dataManager.getSourcesByProject(projectmeta.project.id)
                    .then(function (sources) {
                        if (sources.length) {
                            if (projectmeta.resource.id !== "udb") {
                                sources = _.filter(sources, function(source) {
                                    return source.resource_id !== "udb";
                                });
                            }

                            sources.forEach(function (source) {
                                var inarray = false;
                                projectmeta.source_translations.forEach(function (current) {
                                    if (current.unique_id === source.unique_id) {
                                        inarray = true;
                                    }
                                });
                                source.selected = inarray;
                            });

                            modal.set('master', sources);

                            return modal.organizeSources()
                                .then(function () {
                                    mythis.fire('iron-signal', {name: 'closeloading'});
                                    setTimeout(function() {
                                        mythis.$.sourcepopup.open();
                                    }, 500);
                                });
                        } else {
                            mythis.set('options.title', App.translate("loading_failed"));
                            mythis.set('options.body', App.translate("source_not_found_error"));
                            mythis.set('options.loading', false);
                        }
                    });
            }, 500);
        },

        closesource: function () {
            this.$.sourcepopup.close();
        },

        openresource: function (event, data) {
            var display = this.$.resourcedisplay;

            display.fillresource(data.content);
            display.classList.remove("hide");
            display.classList.add("slidein");
            setTimeout(function() {
                display.classList.remove("slidein");
            }, 500);
        },

        closeresource: function () {
            var display = this.$.resourcedisplay;

            if (!display.classList.contains("hide")) {
                display.classList.add("slideout");
                setTimeout(function() {
                    display.classList.add("hide");
                    setTimeout(function() {
                        display.classList.remove("slideout");
                    }, 300);
                }, 300);
            }
        },

        load: function (route) {
            if (route === "translate") {
                this.forceResize();
            }
        },

        forceResize: function () {
            this.$.readmode.notifyResize();
            this.$.chunkmode.notifyResize();
            this.$.reviewmode.notifyResize();
            this.$.conflictmode.notifyResize();
        },

        resolveConflict: function () {
            this.set('currentproject.conflicts', this.currentproject.conflicts - 1);
            if (this.currentproject.conflicts === 0 && this.selected === 5) {
                this.set('selected', 3);
            }
        },

        updatestate: function (event, data) {
            var id = data.id;
            var mode = data.mode;
            this.currentproject.statedata[id][mode] = data.value;
        },

        savestate: function () {
            if (this.route === "translate") {
                var key = this.currentproject.projectmeta.unique_id;
                this.getlocation();
                var selected = this.selected !== 4 ? this.selected : null;
                App.configurator.setValue(key + "-chapter", this.modestatus.chapter);
                App.configurator.setValue(key + "-index", this.modestatus.index);
                App.configurator.setValue(key + "-selected", selected);
            }
        },

        updatecompletion: function () {
            var chunks = this.currentproject.chunks;
            var finished = [];

            for (var i = 0; i < chunks.length; i++) {
                if (chunks[i].completed) {
                    finished.push(chunks[i].chunkmeta.chapterid + "-" + chunks[i].chunkmeta.frameid);
                }
            }

            this.set('currentproject.projectmeta.finished_chunks', finished);
            this.savemanifest();
        },

        savesource: function () {
            var key = this.currentproject.projectmeta.unique_id;
            var source = this.currentproject.projectmeta.currentsource;
            if (source !== null) {
                App.configurator.setValue(key + "-source", source);
            } else {
                App.configurator.unsetValue(key + "-source");
            }
        },

        retrievesource: function () {
            var key = this.currentproject.projectmeta.unique_id;
            var source = App.configurator.getValue(key + "-source");
            if (source && source < this.currentproject.projectmeta.source_translations.length) {
                this.set('currentproject.projectmeta.currentsource', source);
            }
        },

        loadProject: function (event, data) {
            const myThis = this;
            const nav = data.nav;
            const projectMeta = data.projectmeta;
            const list = this.projectlist;
            const review = this.$.reviewmode;

            const loadSource = function () {
                if (projectMeta.project_type_class === "extant") {
                    myThis.createextantchunks();
                    myThis.finishLoading(nav, false);
                } else {
                    myThis.createChunks(nav, false);
                }
            };

            const loadWords = function () {
                if (projectMeta.project_type_class !== "extant") {
                    let wordMeta = false;
                    for (let i = 0; i < list.length; i++) {
                        if (list[i].target_language.id === projectMeta.target_language.id && list[i].type.id === "tw") {
                            wordMeta = list[i];
                        }
                    }
                    if (wordMeta) {
                        App.projectsManager.loadTargetTranslation(wordMeta)
                            .then(function (words) {
                                myThis.set('currentproject.rawdata.words', words);
                                loadSource();
                            });
                    } else {
                        myThis.set('currentproject.rawdata.words', {});
                        loadSource();
                    }
                } else {
                    myThis.set('currentproject.rawdata.words', {});
                    loadSource();
                }
            };

            const loadData = function () {
                if (projectMeta.project_type_class === "helps") {
                    let i;
                    let secondMeta = false;
                    for (i = 0; i < list.length; i++) {
                        if (list[i].project.id === projectMeta.project.id &&
                            list[i].target_language.id === projectMeta.target_language.id &&
                            (list[i].resource.id === "ulb" || list[i].resource.id === "obs")
                        ) {
                            secondMeta = list[i];
                        }
                    }
                    if (!secondMeta) {
                        for (i = 0; i < list.length; i++) {
                            if (list[i].project.id === projectMeta.project.id &&
                                list[i].target_language.id === projectMeta.target_language.id &&
                                (list[i].resource.id === "udb" || list[i].resource.id === "reg")
                            ) {
                                secondMeta = list[i];
                            }
                        }
                    }
                    if (secondMeta) {
                        App.projectsManager.loadTargetTranslation(secondMeta)
                            .then(function (secondTranslation) {
                                myThis.set('currentproject.rawdata.second', secondTranslation);
                                loadWords();
                            });
                    } else {
                        myThis.set('currentproject.rawdata.second', {});
                        loadWords();
                    }
                } else {
                    myThis.set('currentproject.rawdata.second', {});
                    loadWords();
                }
            };

            myThis.set('options', {});
            myThis.set('options.body', App.translate("loading_project"));
            myThis.set('options.loading', true);
            myThis.fire('iron-signal', {name: 'openloading'});

            setTimeout(function() {
                myThis.set('currentproject.projectmeta', projectMeta);
                myThis.set('currentproject.statedata', {});
                myThis.set('currentproject.rawdata', {});
                myThis.set('currentproject.conflicts', 0);
                myThis.fire('iron-signal', {name: 'updatebemode'});
                review.closesearch();
                myThis.retrievesource();
                if (nav === "translate") {
                    myThis.route = "translate";
                }
                setTimeout(function() {
                    return App.projectsManager.loadTargetTranslation(projectMeta)
                        .then(function (translation) {
                            myThis.set('currentproject.rawdata.main', translation);
                            if (projectMeta.type.id === "ta") {
                                throw App.translate("translation_academy_projects_error");
                            }
                            const source = projectMeta.source_translations[projectMeta.currentsource];

                            if (source) {
                                return App.dataManager.activateProjectContainers(
                                    source.language_id,
                                    projectMeta.project.id,
                                    source.resource_id
                                );
                            } else {
                                return Promise.resolve(true);
                            }
                        })
                        .then(function () {
                            loadData();
                        })
                        .catch(function(err) {
                            App.reporter.logError(err);
                            let errorMessage = err.data?.message || err.message || err.stderr || App.translate("loading_project_error");
                            if (typeof errorMessage !== "string") {
                                errorMessage = JSON.stringify(errorMessage, null, 2);
                            }
                            myThis.set('route', 'home');
                            myThis.set('options.title', App.translate("load_project_failed"));
                            myThis.set('options.body', errorMessage);
                            myThis.set('options.loading', false);
                        });
                }, 500);
            }, 500);
        },

        updatesources: function (event, data) {
            var mythis = this;
            mythis.set('options', {});
            mythis.set('options.body', App.translate("loading_source"));
            mythis.set('options.loading', true);
            mythis.fire('iron-signal', {name: 'openloading'});
            setTimeout(function() {
                mythis.changesources(data.sources, data.current);
                mythis.getlocation();
                mythis.reloaddata(data.full);
            }, 250);
        },

        changesources: function (sources, current) {
            var mythis = this;

            mythis.set('currentproject.projectmeta.source_translations', sources);
            mythis.set('currentproject.projectmeta.currentsource', current);
            mythis.savemanifest();
            mythis.savesource();
        },

        reloaddata: function (full) {
            var mythis = this;
            var projectmeta = mythis.currentproject.projectmeta;
            var source = projectmeta.source_translations[projectmeta.currentsource];

            return mythis.saveAll()
                .then(function () {
                    if (source) {
                        return App.dataManager.activateProjectContainers(source.language_id, projectmeta.project.id, source.resource_id);
                    } else {
                        return Promise.resolve(true);
                    }
                })
                .then(function () {
                    return App.projectsManager.loadTargetTranslation(projectmeta);
                })
                .then(function (translation) {
                    mythis.set('currentproject.rawdata.main', translation);
                    mythis.createChunks("reload", full);
                });
        },

        savechunk: function (event, data) {
            if (this.saveoptions.chunks.indexOf(data.chunk.index) < 0) {
                this.push('saveoptions.chunks', data.chunk.index);
            }
            this.createChapters();
        },

        writeChunk: function (event, data) {
            const meta = this.currentproject.projectmeta;
            App.projectsManager.saveTargetChunk(data.chunk, meta)
                .then(function () {
                    App.projectsManager.saveTargetManifest(meta)
                })
                .catch(function (err) {
                    App.reporter.logError(err, App.translate("saving_chunk_error"));
                });
        },

        savemanifest: function () {
            this.set('saveoptions.manifest', true);
        },

        addcontributor: function () {
            var user = this.currentuser.full_name;
            var array = this.currentproject.projectmeta.translators;
            if (array.indexOf(user) === -1) {
                this.push('currentproject.projectmeta.translators', user);
                this.savemanifest();
            }
        },

        invalidSource: function (nav, full) {
            var mythis = this;
            var projectmeta = _.cloneDeep(this.currentproject.projectmeta);
            var selected = projectmeta.currentsource;
            var sources = projectmeta.source_translations;
            var source = sources[selected];
            var container = source.language_id + "_" + source.project_id + "_" + source.resource_id;

            mythis.set('options.body', App.translate("removing_invalid_source", container));
            mythis.set('options.loading', true);

            sources.splice(selected, 1);
            selected = sources.length ? sources.length - 1 : null;

            mythis.changesources(sources, selected);

            setTimeout(function() {
                mythis.createChunks(nav, full);
            }, 5000);
        },

        createChunks: function (nav, full) {
            const projectMeta = this.currentproject.projectmeta;
            let selected = projectMeta.currentsource;
            if (selected === null || selected === undefined || !projectMeta.source_translations.length) {
                this.finishLoading(nav, full);
                return;
            }
            if (selected >= projectMeta.source_translations.length) {
                selected = projectMeta.source_translations.length -1;
            }
            const source = projectMeta.source_translations[selected];
            const container = source.language_id + "_" + source.project_id + "_" + source.resource_id;
            const frames = App.dataManager.getContainerData(container);
            const notes = App.dataManager.getSourceNotes(source);
            const questions = App.dataManager.getSourceQuestions(source);
            const udb = App.dataManager.getSourceUdb(source);
            const wordlist = App.dataManager.getSourceWords(source);
            const chunkArray = [];
            let title = "";

            if (!frames.length) {
                this.invalidSource(nav, full);
                return;
            }

            this.set('currentproject.conflicts', 0);

            for (let i = 0; i < frames.length; i++) {
                if (frames[i].chunk === "title") {
                    title = frames[i].content;
                }

                const sourceData = App.renderer.convertVerseMarkers(frames[i].content);
                const resources = this.getFrameResources(
                    source.language_id,
                    frames[i],
                    notes,
                    questions,
                    udb,
                    wordlist,
                    sourceData.verses
                );
                const chunkMeta = this.createFrameMeta(frames[i], projectMeta, sourceData.verses, title);
                const chunk = this.getFrameData(chunkMeta, projectMeta);

                const rawsourcecontent = sourceData.text;
                let sourceContent = App.renderer.convertNoteMarkers(rawsourcecontent);
                sourceContent = App.renderer.removeParaTags(sourceContent);
                sourceContent = App.renderer.removeCharTags(sourceContent);

                chunk.rawsourcecontent = rawsourcecontent;
                chunk.srccontent = App.renderer.renderSuperscriptVerses(sourceContent);
                chunk.wordcontent = "";
                chunk.resources = resources;
                chunk.index = i;

                chunkArray.push(chunk);
            }
            this.set('currentproject.chunks', chunkArray);
            this.createChapters();
            this.finishLoading(nav, full);
        },

        finishLoading: function (nav, full) {
            const myThis = this;

            if (nav === "translate") {
                myThis.setmodestate();
                myThis.checksources();
                myThis.starttimers();
            } else if (nav === "review") {
                myThis.goreview();
            } else if (nav === "print") {
                myThis.fire('iron-signal', {name: 'closeloading'});
                setTimeout(function() {
                    myThis.fire('openprint');
                }, 500);
            } else if (nav === "export") {
                myThis.fire('iron-signal', {name: 'closeloading'});
                setTimeout(function() {
                    myThis.fire('exportusfm');
                }, 500);
            } else if (nav === "reload") {
                if (!full) {
                    myThis.fire('iron-signal', {name: 'closeloading'});
                }
                myThis.forceResize();
                myThis.setlocation();
                myThis.fire('iron-signal', {name: 'passivesearch'});
                if (full) {
                    myThis.checksources();
                }
            }
        },

        createChapters: function () {
            const projectMeta = this.currentproject.projectmeta;
            const current = projectMeta.currentsource;
            if (current === null || current === undefined || projectMeta.project_type_class !== "standard") {
                return;
            }
            const chunks = this.currentproject.chunks;
            const myThis = this;
            const chapters = [];

            _.forEach(_.groupBy(chunks, function(chunk) {
                return chunk.chunkmeta.chapter;
            }), function (data, chap) {
                let chapComplete = true;
                let conflicts = false;
                let transContent = "";
                let srcContent = "";
                let chapterMeta = {};

                _.forEach(data, function (chunk) {
                    if (chunk.chunkmeta.frame > 0) {
                        if (!chunk.completed) {
                            chapComplete = false;
                        }
                        if (chunk.conflicts.exists) {
                            conflicts = true;
                        }
                        transContent += chunk.transcontent + " ";
                        srcContent += chunk.srccontent + " ";
                        chapterMeta = chunk.chunkmeta;
                    }
                });
                let stateData = myThis.currentproject.statedata[chapterMeta.chapterid];
                if (!stateData) {
                    stateData = { read: App.configurator.getUserSetting('bemode') };
                    myThis.currentproject.statedata[chapterMeta.chapterid] = stateData;
                }
                if (chapterMeta.chapter > 0) {
                    chapters.push({
                        completed: chapComplete,
                        conflicts: conflicts,
                        transcontent: transContent,
                        srccontent: srcContent,
                        projectmeta: _.cloneDeep(projectMeta),
                        chaptermeta: chapterMeta,
                        state: stateData
                    });
                }
            });
            this.set('currentproject.chapters', chapters);
        },

        createextantchunks: function () {
            var projectmeta = this.currentproject.projectmeta;
            var type = projectmeta.type.id;
            var language = projectmeta.target_language.name;
            var frames = [];
            var chunkarray = [];

            this.set('currentproject.conflicts', 0);

            if (type === "tw") {
                var dict = projectmeta.project.id;
                let sourceLanguage = "en";
                var currentSource = projectmeta.currentsource;
                if (currentSource) {
                    sourceLanguage = projectmeta.source_translations[currentSource].language_id;
                }
                frames = App.dataManager.getAllWords(sourceLanguage, dict);
            }

            for (var i = 0; i < frames.length; i++) {
                var chunkmeta = {
                    chapterid: "01",
                    chapter: 1,
                    frameid: frames[i].slug,
                    verses: [],
                    chunkref: frames[i].title,
                    refaddon: " — " + language
                };
                var chunk = this.getFrameData(chunkmeta, projectmeta);
                chunk.srccontent = frames[i].body;
                chunk.wordcontent = frames[i].title;
                chunk.resources = [];
                chunk.index = i;
                chunkarray.push(chunk);
            }
            this.set('currentproject.chunks', chunkarray);
        },

        getFrameResources: function (language_id, frame, notes, questions, udb, wordlist, verses) {
            var mythis = this;
            var resources = [];
            var note = [];
            var question = [];
            var words = [];
            var framewords = [];
            var udbtext = null;

            var framenotes = notes.filter(function (note) {
                return note.chapter === frame.chapter && note.chunk === frame.chunk;
            });
            if (framenotes.length) {
                note = framenotes[0].content;
            }
            if (note.length) {
                resources.push({title: App.translate("resource_notes"), array: true, data: note});
            }

            if (wordlist && wordlist[frame.chapter] && wordlist[frame.chapter][frame.chunk]) {
                framewords = wordlist[frame.chapter][frame.chunk].words;
            }

            framewords.forEach(function (frameword) {
                var split = _.compact(frameword.split("/"));
                var word = App.dataManager.getWord(language_id, split[0], split[2]);

                if (word) {
                    words.push(word);
                } else {
                    console.log(App.translate("cannot_find_data", frame.chapter, frame.chunk, frameword));
                }
            });

            for (var w = 0; w < words.length; w++) {
                var worddata = this.currentproject.rawdata.words["01-" + words[w].slug];

                if (worddata) {
                    var parsed = false;

                    try {
                        parsed = JSON.parse(worddata.helpscontent);
                    } catch (e) {
                        parsed = false;
                    }

                    if (parsed && parsed[0] && parsed[0].body !== "" && parsed[0].title !== "") {
                        words[w].title = parsed[0].title;
                        words[w].body = parsed[0].body;
                    }
                }
            }

            if (words.length) {
                resources.push({title: App.translate("resource_words"), array: true, data: words});
            }

            var frameques = questions.filter(function (ques) {
                if (verses.length) {
                    return ques.chapter === frame.chapter && parseInt(ques.chunk) >= verses[0] && parseInt(ques.chunk) <= verses[verses.length - 1];
                } else {
                    return ques.chapter === frame.chapter && ques.chunk === frame.chunk;
                }
            });
            if (frameques.length) {
                frameques.forEach(function (frame) {
                    question.push(frame.content);
                });

                question = _.flatten(question);
                question = _.uniq(question, 'title');
            }
            if (question.length) {
                resources.push({title: App.translate("resource_questions"), array: true, data: question});
            }

            var frameudb = udb.filter(function (chunk) {
                return chunk.chapter === frame.chapter && chunk.chunk === frame.chunk;
            });
            if (frameudb.length && frame.chunk !== "title") {
                udbtext = frameudb[0].content;
            }
            if (udbtext) {
                udbtext = App.renderer.convertVerseMarkers(udbtext).text;
                udbtext = App.renderer.convertNoteMarkers(udbtext);
                udbtext = App.renderer.removeParaTags(udbtext);
                udbtext = App.renderer.removeCharTags(udbtext);
                udbtext = App.renderer.renderSuperscriptVerses(udbtext);
                resources.push({title: "UDB", array: false, data: [udbtext]});
            }

            return resources;
        },

        createFrameMeta: function (frame, projectmeta, verses, title) {
            var refaddon = projectmeta.target_language.name;
            var resource = projectmeta.resource.id;
            var name = projectmeta.project.name;
            var id = projectmeta.project.id;
            var chapterid = frame.chapter;
            var chapternum = parseInt(chapterid) || 1;
            var frameid = frame.chunk;
            var framenum = parseInt(frameid) || 0;
            var chapterref;
            var chunkref;

            if (resource === "ulb" || resource === "udb") {
                refaddon += " (" + resource + ")";
            }

            if (name === "Open Bible Stories") {
                if (chapterid === "front" && frameid === "title") {
                    chapterref = App.translate("project_title");
                    chunkref = App.translate("project_title");
                } else if (frameid === "title") {
                    chapterref = App.translate("story_title");
                    chunkref = App.translate("story_title");
                } else if (frameid === "reference") {
                    chapterref = App.translate("story_reference");
                    chunkref = App.translate("story_reference");
                } else {
                    chapterref = title;
                    chunkref = App.translate("story_chunk_title", title, framenum);
                }
            } else {
                if (chapterid === "front" && frameid === "title") {
                    chapterref = App.translate("project_title");
                    chunkref = App.translate("project_title");
                } else if (frameid === "title") {
                    name = App.translate(`book_${id}`);
                    chapterref = App.translate("project_chapter_title", name, chapternum);
                    chunkref = App.translate("project_chapter_title", name, chapternum);
                } else {
                    name = App.translate(`book_${id}`);
                    chapterref = name + " " + chapternum;
                    chunkref = name + " " + chapternum + ":" + verses[0] + "–" + verses[verses.length-1];
                }
            }

            return {
                chapter: chapternum,
                frame: framenum,
                chapterid: chapterid,
                frameid: frameid,
                verses: verses,
                chapterref: chapterref,
                chunkref: chunkref,
                refaddon: " — " + refaddon
            };
        },

        getFrameData: function (chunkMeta, projectMeta) {
            let i;
            const typeClass = projectMeta.project_type_class;
            const complexId = chunkMeta.chapterid + '-' + chunkMeta.frameid;
            const verses = chunkMeta.verses;
            const mainData = this.currentproject.rawdata.main[complexId];
            const secondData = this.currentproject.rawdata.second[complexId];
            let stateData = this.currentproject.statedata[complexId];
            const completed = projectMeta.finished_chunks.indexOf(complexId) >= 0;
            let transContent = "";
            let helpsContent = [];
            let conflicts = { exists: false };

            if (typeClass === "extant") {
                helpsContent = [{title: "", body: ""}];
            }

            if (mainData) {
                if (typeClass === "standard") {
                    transContent = mainData.transcontent;
                    conflicts = App.renderer.parseConflicts(App.renderer.replaceConflictCode(transContent));
                    if (conflicts.exists) {
                        this.set('currentproject.conflicts', this.currentproject.conflicts + 1);

                        for (i = 0; i < conflicts.array.length; i++) {
                            conflicts.array[i] = App.renderer.convertVerseMarkers(conflicts.array[i]).text;
                            conflicts.array[i] = App.renderer.migrateMarkers(conflicts.array[i]);
                            conflicts.array[i] = App.renderer.removeChapterMarkers(conflicts.array[i]);
                            conflicts.array[i] = App.renderer.validateVerseMarkers(conflicts.array[i], verses);
                            conflicts.array[i] = App.renderer.validateFootnotes(conflicts.array[i]);
                        }
                    } else {
                        transContent = App.renderer.convertVerseMarkers(transContent).text;
                        transContent = App.renderer.migrateMarkers(transContent);
                        transContent = App.renderer.removeChapterMarkers(transContent);
                        transContent = App.renderer.validateVerseMarkers(transContent, verses);
                        transContent = App.renderer.validateFootnotes(transContent);
                    }
                } else {
                    conflicts = App.renderer.parseConflicts(
                        App.renderer.consolidateHelpsConflict(
                            App.renderer.replaceConflictCode(mainData.helpscontent)
                        )
                    );
                    if (conflicts.exists) {
                        this.set('currentproject.conflicts', this.currentproject.conflicts + 1);
                        helpsContent = [{title: "Dummy Data", body: "Dummy Data"}];

                        for (i = 0; i < conflicts.array.length; i++) {
                            if (conflicts.array[i] === "Conflict Parsing Error") {
                                conflicts.array[i] = [{title: "Conflict Parsing Error", body: "Conflict Parsing Error"}];
                            }
                            try {
                                conflicts.array[i] = JSON.parse(conflicts.array[i]);
                            } catch (e) {
                                conflicts.array[i] = [{title: "Conflict Parsing Error", body: "Conflict Parsing Error"}];
                            }
                        }
                    } else {
                        try {
                            helpsContent = JSON.parse(mainData.helpscontent);
                        } catch (e) {
                            helpsContent = [{title: "Data Parsing Error", body: "Data Parsing Error"}];
                        }
                    }
                }
            }
            if (secondData && typeClass === "helps") {
                transContent = secondData.transcontent;
                transContent = App.renderer.migrateMarkers(transContent);
                transContent = App.renderer.removeChapterMarkers(transContent);
            }
            if (!stateData) {
                stateData = {chunk: true, review: true, resource: 0};
                this.currentproject.statedata[complexId] = stateData;
            }
            return {
                projectmeta: _.cloneDeep(projectMeta),
                chunkmeta: chunkMeta,
                transcontent: transContent,
                helpscontent: helpsContent,
                conflicts: conflicts,
                completed: completed,
                state: stateData
            };
        },

        navigate: function () {
            var read = this.$.readmode;
            var chunk = this.$.chunkmode;
            var review = this.$.reviewmode;
            var conflict = this.$.conflictmode;

            if (this.selected === 1) {
                read.setlocation();
            } else if (this.selected === 2) {
                chunk.setlocation();
            } else if (this.selected === 3) {
                review.setlocation();
            } else if (this.selected === 5) {
                conflict.setlocation();
            }
        },

        modechange: function (tomode, frommode) {
            var read = this.$.readmode;
            var chunk = this.$.chunkmode;
            var review = this.$.reviewmode;
            var nosource = this.$.nosourcemode;
            var conflict = this.$.conflictmode;

            this.closeresource();

            if (frommode > 0 && frommode !== 4) {
                this.set('modestatus.lastmode', frommode);
            }

            if (frommode === 1) {
                read.frommode();
            } else if (frommode === 2) {
                chunk.frommode();
            } else if (frommode === 3) {
                review.frommode();
            } else if (frommode === 4) {
                nosource.frommode();
            } else if (frommode === 5) {
                conflict.frommode();
            }

            if (tomode === 1) {
                read.tomode();
            } else if (tomode === 2) {
                chunk.tomode();
            } else if (tomode === 3) {
                review.tomode();
            } else if (tomode === 4) {
                nosource.tomode();
            } else if (tomode === 5) {
                conflict.tomode();
            }
        },

        reset: function () {
            var mythis = this;
            var read = this.$.readmode;
            var chunk = this.$.chunkmode;
            var review = this.$.reviewmode;
            var nosource = this.$.nosourcemode;
            var conflict = this.$.conflictmode;

            mythis.set('selected', 0);
            mythis.set('modestatus', {"chapter": 1, "lastmode": 1, "index": -1});
            read.classList.add("hide");
            chunk.classList.add("hide");
            review.classList.add("hide");
            nosource.classList.add("hide");
            conflict.classList.add("hide");
            mythis.stoptimers();
            mythis.closeresource();
        },

        setmodestate: function () {
            const mythis = this;
            const projectmeta = this.currentproject.projectmeta;
            const key = projectmeta.unique_id;
            const index = parseInt(App.configurator.getValue(key + "-index")) || 0;
            const chapter = parseInt(App.configurator.getValue(key + "-chapter")) || 0;
            const bemode = App.configurator.getUserSetting('bemode');
            const typeclass = projectmeta.project_type_class;

            if (chapter > 0) {
                mythis.set('modestatus.chapter', chapter);
            }
            if (index >= 0) {
                mythis.set('modestatus.index', index);
            }
            if (typeclass === "standard" && bemode) {
                mythis.set('modestatus.lastmode', 1);
            } else {
                mythis.set('modestatus.lastmode', 3);
            }
        },

        checksources: function () {
            var mythis = this;
            var projectmeta = this.currentproject.projectmeta;
            var sources = projectmeta.source_translations;
            var lastmode = this.modestatus.lastmode;
            var selected = this.selected;
            var typeclass = projectmeta.project_type_class;
            var key = projectmeta.unique_id;
            var previous = App.configurator.getValue(key + "-selected");
            var bemode = App.configurator.getUserSetting('bemode');
            var gotomode = 3;

            if (previous === 2 && !bemode) {
                previous = 3;
            }

            if ((sources === undefined || sources.length === 0) && typeclass !== "extant") {
                gotomode = 4;
            } else if (selected === 4 && lastmode !== 4) {
                gotomode = lastmode;
            } else if (previous > 0 && previous !== 4) {
                gotomode = previous;
            } else if (typeclass === "standard" && bemode) {
                gotomode = 1;
            }

            setTimeout(function() {
                if (selected === gotomode) {
                    mythis.fire('iron-signal', {name: 'closeloading'});
                } else {
                    mythis.set('selected', gotomode);
                }
            }, 500);
        },

        getlocation: function () {
            var selected = this.selected;
            var read = this.$.readmode;
            var chunk = this.$.chunkmode;
            var review = this.$.reviewmode;

            if (selected === 1) {
                read.getlocation();
            } else if (selected === 2) {
                chunk.getlocation();
            } else if (selected === 3) {
                review.getlocation();
            }
        },

        setlocation: function () {
            var selected = this.selected;
            var read = this.$.readmode;
            var chunk = this.$.chunkmode;
            var review = this.$.reviewmode;
            var conflict = this.$.conflictmode;

            if (selected === 1) {
                read.setlocation();
            } else if (selected === 2) {
                chunk.setlocation();
            } else if (selected === 3) {
                review.setlocation();
            } else if (selected === 5) {
                conflict.setlocation();
            }
        },

        setheights: function () {
            var selected = this.selected;
            var read = this.$.readmode;
            var chunk = this.$.chunkmode;

            if (selected === 1) {
                read.setheights();
            } else if (selected === 2) {
                chunk.setheights();
            }
        },

        fromreview: function (event, data) {
            var mythis = this;

            mythis.set('options', {});
            mythis.set('options.body', App.translate("loading_project"));
            mythis.set('options.loading', true);
            mythis.fire('iron-signal', {name: 'openloading'});

            setTimeout(function() {
                if (data.index === null) {
                    mythis.set('route', "translate");
                    mythis.setmodestate();
                    mythis.checksources();
                    mythis.starttimers();
                } else {
                    mythis.set('selected', 0);
                    mythis.set('modestatus.index', data.index);
                    mythis.set('route', "translate");
                    setTimeout(function() {
                        mythis.set('selected', 3);
                        mythis.starttimers();
                    }, 500);
                }
            }, 500);
        },

        gohome: function () {
            var mythis = this;

            mythis.set('options', {});
            mythis.set('options.body', App.translate("closing_project_status"));
            mythis.set('options.loading', true);
            mythis.fire('iron-signal', {name: 'openloading'});

            setTimeout(function() {
                mythis.savestate();
                mythis.stoptimers();

                return mythis.saveAll()
                    .then(function () {
                        mythis.fire('update');
                    });
            }, 500);
        },

        goreview: function () {
            var mythis = this;
            var typeclass = mythis.currentproject.projectmeta.project_type_class;

            if (mythis.currentproject.projectmeta.source_translations.length || typeclass === "extant") {
                mythis.set('options', {});
                mythis.set('options.body', App.translate("loading_review_status"));
                mythis.set('options.loading', true);
                mythis.fire('iron-signal', {name: 'openloading'});
                setTimeout(function() {
                    mythis.closeresource();
                    mythis.savestate();
                    mythis.setleftanimation();
                    mythis.stoptimers();
                    return mythis.saveAll()
                        .then(function () {
                            mythis.fire('iron-signal', {name: 'updatereview'});
                            mythis.fire('iron-signal', {name: 'closeloading'});
                            mythis.set('route', "review");
                        });
                }, 250);
            } else {
                mythis.set('options', {});
                mythis.set('options.title', App.translate("project_empty"));
                mythis.set('options.body', App.translate("project_nothing_to_review"));
                mythis.set('options.loading', false);
                mythis.fire('iron-signal', {name: 'openloading'});
            }
        },

        goprint: function () {
            var mythis = this;

            mythis.stoptimers();
            return mythis.saveAll()
                .then(function () {
                    mythis.fire('iron-signal', {name: 'closeloading'});
                    mythis.fire('openprint');
                    mythis.starttimers();
                });
        },

        goexport: function () {
            var mythis = this;

            mythis.stoptimers();
            return mythis.saveAll()
                .then(function () {
                    mythis.fire('iron-signal', {name: 'closeloading'});
                    mythis.fire('iron-signal', {name: 'openexport'});
                    mythis.starttimers();
                });
        },

        gosettings: function () {
            var mythis = this;

            mythis.savestate();
            mythis.setleftanimation();
            App.configurator.setValue("backto", this.route);

            return mythis.saveAll()
                .then(function () {
                    setTimeout(function() {
                        mythis.set('route', "settings");
                    }, 500);
                });
        },

        gosearch: function () {
            var review = this.$.reviewmode;

            review.opensearch();
        },

        setrightanimation: function () {
            this.animationConfig.exit.name = 'slide-right-animation';
            this.animationConfig.entry.name = 'slide-from-right-animation';
        },

        setleftanimation: function () {
            this.animationConfig.exit.name = 'slide-left-animation';
            this.animationConfig.entry.name = 'slide-from-left-animation';
        },

        markchunksdone: function () {
            var mythis = this;
            var chunks = mythis.currentproject.chunks;
            var marked = 0;
            chunks.forEach(function(chunk, index) {
                if (chunk.transcontent !== "") {
                    chunk.completed = true;
                    mythis.fire('iron-signal', {name: 'completechunk', data: {index: index}});
                    marked++;
                }
            });

            var title = App.translate("result");
            var message = App.translate("chunks_marked_done_result", marked, chunks.length);
            mythis.fire('iron-signal', {name: 'showmessage', data: {title, message}});
        },

        buttonclass: function (target) {
            return !target ? 'hide' : '';
        },

        translate: App.translate,

        ready: function() {
            var mythis = this;

            mythis.reset();
            window.addEventListener("resize", function () {
                mythis.getlocation();
                mythis.setlocation();
                mythis.setheights();
            });
            window.addEventListener("keyup", function (e) {
                if (e.key == "Meta") {
                    mythis.set('cmdKeyDown', false);
                }
            });
            window.addEventListener("keydown", function(e) {
                if (mythis.route === "translate" && mythis.selected === 3 && mythis.currentproject.projectmeta.project_type_class === "standard") {
                    if (e.key == "Meta") {
                        mythis.set('cmdKeyDown', true);
                    }
                    if ((mythis.cmdKeyDown || e.ctrlKey) && e.keyCode == 70) {
                        mythis.gosearch();
                    }
                }
            });
        }
    });

</script>
