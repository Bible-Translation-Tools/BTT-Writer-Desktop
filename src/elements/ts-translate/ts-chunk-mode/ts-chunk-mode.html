
<link rel="import" href="../../../components/iron-list/iron-list.html">

<link rel="import" href="./ts-chunk-card.html">

<dom-module id="ts-chunk-mode">

    <style>

        :host {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            display: flex;
        }

        #contain {
            flex: auto;
        }

        #chunklist {
            max-height: calc(100vh - 70px);
        }

        ::-webkit-scrollbar {
            display: none;
        }

        :host(.preview) {
            opacity: 0;
        }

        :host(.hide) {
            visibility: hidden;
        }

        .movein {
            -webkit-animation: moveinto .3s;
        }

        .moveout {
            -webkit-animation: moveout .3s;
        }

        @-webkit-keyframes moveinto {
            0% {transform: scale(0,0); opacity: 0}
            100% {transform: scale(1,1); opacity: 1}
        }

        @-webkit-keyframes moveout {
            0% {transform: scale(1,1); opacity: 1}
            100% {transform: scale(0,0); opacity: 0}
        }

        :host::shadow #items {
            margin-bottom: 300px;
        }

    </style>

    <template>

        <div id="contain">
            <iron-list id="chunklist" items="{{chunks}}" as="chunk" on-scroll="refresh">
                <template>
                    <ts-chunk-card id="{{createid(index)}}" chunk="{{chunk}}" on-updateheight="updateheight"></ts-chunk-card>
                </template>
            </iron-list>
        </div>

    </template>

</dom-module>

<script>

	Polymer({

		is: 'ts-chunk-mode',

        behaviors: [
            Polymer.IronResizableBehavior
        ],

        properties: {
            chunks: {
                type: Array,
                value: [],
                notify: true
            },
            modestatus: {
                type: Object,
                value: {},
                notify: true
            },
            modename: {
                type: String,
                value: "chunk"
            },
            timer: {
                type: Number
            },
            active: {
                type: Boolean,
                value: false
            },
            scrollTicking: {
                type: Boolean,
            }
        },

        updateheight: function (e) {
            const list = this.$.chunklist;
            const index = e.model.index;
            list.updateSizeForItem(index);
        },

        refresh: function () {
            const mythis = this;

            if (this.active) {
                if (!this.scrollTicking) {
                    window.requestAnimationFrame(() => {
                        mythis.getlocation();
                        this.scrollTicking = false;
                    });
                    this.scrollTicking = true;
                }

                this.cancelAsync(this.timer);
                this.timer = this.async(() => {
                    mythis.setheights();
                }, 1);
            }
        },

        setheights: function () {
            const list = this.$.chunklist;

            list.fire('iron-resize');

            for (let i = list.firstVisibleIndex; i <= list.lastVisibleIndex; i++) {
                const card = document.getElementById(this.modename + i);
                if (card && this.chunks && i < this.chunks.length) {
                    card.setheight();
                }
            }
        },

        frommode: function () {
            this.set('active', false);
            this.getlocation();
            this.moveout();
        },

        tomode: function () {
            this.set('active', true);
            this.setpreview();
            this.setheights();
            this.movein();
        },

        moveout: function () {
            const mythis = this;
            const contain = this.$.contain;

            contain.classList.add("moveout");
            setTimeout(function() {
                mythis.classList.add("hide");
                setTimeout(function() {
                    contain.classList.remove("moveout");
                }, 300);
            }, 300);
        },

        movein: function () {
            const mythis = this;
            const contain = this.$.contain;

            setTimeout(function() {
                mythis.classList.remove("preview");
                contain.classList.add("movein");
                setTimeout(function() {
                    contain.classList.remove("movein");
                    mythis.setheights();
                    mythis.setlocation();
                    mythis.fire('iron-signal', {name: 'closeloading'});
                }, 300);
            }, 300);
        },

        setpreview: function () {
            this.classList.add("preview");
            this.classList.remove("hide");
        },

        getlocation: function () {
            const index = this.getTopVisibleIndex();
            const chunks = this.chunks;

            if (chunks && chunks.length) {
                this.set('modestatus.chapter', chunks[index].chunkmeta.chapter);
                this.set('modestatus.index', index);
            }
        },

        setlocation: function () {
            let index = parseInt(this.modestatus.index) || 0;
            const chunks = this.chunks;
            const chapter = this.modestatus.chapter;

            if (index < 0) {
                const filtered = chunks.filter(function (chunk) {
                    return chunk.chunkmeta.chapter === chapter;
                });
                if (filtered.length) {
                    index = filtered[0].index;
                } else {
                    index = chunks.length - 1;
                }
            }

            this.async(() => {
                this.$.chunklist.scrollToIndex(index);
            }, 1);
        },

        createid: function (index) {
            return this.modename + index;
        },

        getTopVisibleIndex: function () {
            const list = this.$.chunklist;
            const listRect = list.getBoundingClientRect();

            const checkPoint = listRect.top + 20;

            const items = list.querySelectorAll('ts-chunk-card');
            let index = list.firstVisibleIndex || 0;

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const rect = item.getBoundingClientRect();

                if (checkPoint >= rect.top && checkPoint <= rect.bottom) {
                    const model = list.modelForElement(item);
                    if (model) {
                        index = model.index;
                        break;
                    }
                }
            }

            return index;
        },

		ready: function() {

		}

	});

</script>
