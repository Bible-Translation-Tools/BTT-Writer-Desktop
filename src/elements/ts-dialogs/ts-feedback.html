
<link rel="import" href="../../components/paper-button/paper-button.html">
<link rel="import" href="../../components/iron-autogrow-textarea/iron-autogrow-textarea.html">
<link rel="import" href="../../components/iron-input/iron-input.html">
<link rel="import" href="../../components/iron-icons/iron-icons.html">
<link rel="import" href="../../components/iron-icons/notification-icons.html">

<dom-module id="ts-feedback">

    <style>

        :host {
            display: flex;
            flex-direction: column;
        }

        #header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 30px 10px;
        }

        #body {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        #footer {
            display: flex;
            justify-content: flex-end;
            margin: 10px 50px;
            gap: 20px;
        }

        #footer paper-button:hover {
            color: var(--accent-color);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #feedback {
            font-size: 120%;
            padding: 10px;
            color: var(--secondary-text-color);
            width: 500px;
            height: 200px;
        }

        input, #feedback {
            background: var(--background-color);
            color: var(--primary-text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 2px;
            font-family: inherit;
            outline: none;
        }

        iron-autogrow-textarea {
            --iron-autogrow-textarea: {
                padding: 8px;
                box-sizing: border-box;
            };
        }
    </style>

    <template>

        <div id="header">
            <h2>{{translate("feedback")}}</h2>
            <p><iron-icon icon="notification:wifi"></iron-icon> {{translate("internet_warning")}}</p>
        </div>
        <div id="body">
            <div class="field-group">
                <input is="iron-input" type="email" bind-value="{{userEmail}}" placeholder={{translate("email_optional")}}>
            </div>
            <div class="field-group">
                <iron-autogrow-textarea id="feedback" bind-value="{{feedback}}" placeholder="{{translate('describe_problem')}}"></iron-autogrow-textarea>
            </div>
        </div>
        <div id="footer">
            <paper-button on-tap="close">{{translate("cancel")}}</paper-button>
            <paper-button on-tap="send">{{translate("send")}}</paper-button>
        </div>

    </template>

</dom-module>

<script>

    Polymer({

        is: 'ts-feedback',

        properties: {
            userEmail: {
                type: String,
                value: "",
                notify: true
            },
            feedback: {
                type: String,
                value: "",
                notify: true
            }
        },

        close: function () {
            this.fire('close');
            this.cleanup();
        },

        send: function () {
            this.fire('send', {userEmail: this.userEmail, feedback: this.feedback});
            this.cleanup();
        },

        cleanup: function () {
            this.userEmail = "";
            this.feedback = "";
        },

        translate: App.translate,

        ready: function () {
        }

    });

</script>
