
<link rel="import" href="../../components/iron-signals/iron-signals.html">
<link rel="import" href="../../components/paper-button/paper-button.html">

<link rel="import" href="./ts-review-chapter.html">

<dom-module id="ts-review-project">

    <style>

        :host {
            display: flex;
        }

        #contain {
            flex: auto;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        #next {
            background: var(--accent-color);
            color: var(--reverse-text-color);
            text-transform: uppercase;
        }

        #button {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

    </style>

    <template>

        <div id="contain">
            <template is="dom-repeat" items="{{chapters}}" as="chapter">
                <ts-review-chapter chapter="[[chapter]]"></ts-review-chapter>
            </template>
            <div id="button">
                <paper-button raised id="next" on-tap="next">{{translate("next")}}</paper-button>
            </div>
        </div>

        <iron-signals on-iron-signal-updatereview="updatereview"></iron-signals>

    </template>

</dom-module>

<script>

    Polymer({

        is: 'ts-review-project',

        properties: {
            selected: {
                type: Number,
                value: 0,
                notify: true
            },
            currentproject: {
                type: Object,
                value: {}
            },
            chapters: {
                type: Array,
                value: []
            }
        },

        updatereview: function () {
            var mythis = this;

            mythis.createChapters();

            setTimeout(function() {
                mythis.$.contain.scrollTop = 0;
            }, 250);
        },

        sortChapters: function (list) {
            return list.sort(function (a, b) {
                if (a.start > b.start) {
                    return 1;
                } else if (a.start < b.start) {
                    return -1;
                } else {
                    return 0;
                }
            });
        },

        createChapters: function () {
            let i;
            const myThis = this;
            let transChapters = [];
            const translation = _.cloneDeep(this.currentproject.chunks);
            const projectMeta = this.currentproject.projectmeta;
            let name = projectMeta.project.name;
            const id = projectMeta.project.id;
            const typeClass = projectMeta.project_type_class;
            const direction = projectMeta.target_language.direction;

            const transData = translation.map(function(chunk, index){
                let start;
                let end;
                if (chunk.chunkmeta.verses.length) {
                    start = chunk.chunkmeta.verses[0];
                    end = chunk.chunkmeta.verses[chunk.chunkmeta.verses.length-1];
                } else if (typeClass === "extant") {
                    start = chunk.chunkmeta.frameid;
                    end = chunk.chunkmeta.frameid;
                } else {
                    start = chunk.chunkmeta.frame;
                    end = chunk.chunkmeta.frame;
                }
                return {
                    transcontent: chunk.transcontent,
                    helpscontent: chunk.helpscontent,
                    completed: chunk.completed,
                    conflicts: chunk.conflicts,
                    chunkmeta: chunk.chunkmeta,
                    index: index,
                    start: start,
                    end: end,
                    combined: false,
                    typeclass: typeClass,
                    direction: direction
                };
            });

            for (i = 0; i < transData.length; i++) {
                if (
                    transData[i].index > 0 &&
                    transData[i].chunkmeta.frame !== 0 &&
                    transData[i-1].chunkmeta.frame !== 0 &&
                    transData[i].completed === true &&
                    transData[i-1].completed === true &&
                    transData[i].chunkmeta.chapter === transData[i-1].chunkmeta.chapter
                ) {
                    if (typeClass === "extant") {
                        transData[i-1].chunkmeta.chunkref = transData[i-1].start + " – " + transData[i].end;
                    } else {
                        transData[i-1].chunkmeta.chunkref = transData[i].chunkmeta.chapterref + ":"
                            + transData[i-1].start + "–"
                            + transData[i].end;
                    }
                    transData[i-1].combined = true;
                    transData.splice(i, 1);
                    i--;
                }
            }

            _.forEach(_.groupBy(transData, function(chunks) {
                return chunks.chunkmeta.chapterid;
            }), function (data, chap) {
                name = myThis.translate(`book_${id}`);
                let chapComplete = true;
                const chapter = parseInt(chap) || 0;
                let reference;
                if (chap === "front") {
                    reference = myThis.translate("project_details");
                } else if (typeClass === "extant") {
                    reference = name;
                } else {
                    myThis.translate("project_chapter_title", name, chapter);
                    reference = myThis.translate("project_chapter_title", name, chapter);
                }

                _.forEach(data, function (chunk) {
                    if (!chunk.completed) {
                        chapComplete = false;
                    }
                });
                transChapters.push({
                    reference: reference,
                    completed: chapComplete,
                    start: chapter,
                    end: chapter,
                    combined: false,
                    chunks: data
                });
            });

            transChapters = this.sortChapters(transChapters);

            for (i = 0; i < transChapters.length; i++) {
                if (transChapters[i].start > 1 && transChapters[i].completed === true && transChapters[i-1].completed === true) {
                    transChapters[i-1].reference = myThis.translate(
                        "project_chapter_title",
                        name,
                        `${transChapters[i-1].start}–${transChapters[i].end}`
                    );
                    transChapters[i-1].combined = true;
                    transChapters.splice(i, 1);
                    i--;
                }
            }

            this.set('chapters', transChapters);
        },

        next: function () {
            this.fire('next');
        },

        translate: function (key, ...args) {
            return App.locale.translate(key, ...args);
        },

        ready: function() {
        }

    });

</script>
