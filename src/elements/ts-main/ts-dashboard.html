<link rel="import" href="./ts-app-titlebar.html">
<link rel="import" href="../ts-profile/ts-profile.html">
<link rel="import" href="../ts-home/ts-home.html">
<link rel="import" href="../ts-new/ts-new.html">
<link rel="import" href="../ts-review/ts-review.html">
<link rel="import" href="../ts-translate/ts-translate.html">
<link rel="import" href="../ts-settings/ts-settings.html">
<link rel="import" href="../ts-updates/ts-updates.html">
<link rel="import" href="../ts-print/ts-print.html">
<link rel="import" href="../ts-dialogs/ts-repo-search.html">
<link rel="import" href="../ts-dialogs/ts-import-options.html">
<link rel="import" href="../ts-dialogs/ts-feedback.html">
<link rel="import" href="../ts-dialogs/ts-loading.html">
<link rel="import" href="../ts-dialogs/ts-export-options.html">
<link rel="import" href="../ts-dialogs/ts-update-options.html">
<link rel="import" href="../ts-dialogs/ts-print-options.html">
<link rel="import" href="../ts-dialogs/ts-conflict.html">
<link rel="import" href="../ts-dialogs/ts-import-confirm.html">
<link rel="import" href="../ts-dialogs/ts-container-confirm.html">
<link rel="import" href="../ts-legal/ts-terms.html">
<link rel="import" href="../ts-legal/ts-license.html">

<dom-module id="ts-dashboard">

  <style>

      :host {
          display: flex;
          flex-direction: column;
          flex: auto;
          background-color: var(--background-color);
          color: var(--primary-text-color);
      }

      neon-animated-pages {
          flex: auto;
          display: flex;
      }

      neon-animated-pages > * {
          flex: auto;
      }

      #statusbar {
          width: 100%;
          background: var(--primary-color-dark);
          color: white;
          min-height: 30px;
          padding: 0 20px;
          font-size: 75%;
          display: flex;
          align-items: center;
      }

      #message {
          padding-left: 10px;
      }

      .popup {
          position: fixed;
          top: 0;
          bottom: 0;
          left: 0;
          right: 0;
          margin: auto;
          background-color: var(--popup-background-color);
          width: fit-content;
          height: fit-content;
          max-width: 750px;
          max-height: 550px;
          padding: 20px;
      }

      .popup * {
          margin: 0;
          padding: 0;
      }

      .legal {
          width: 95%;
          height: 95%;
          overflow-y: auto;
      }

      .hide {
          display: none;
      }

      @media print {
          #statusbar {
              display: none;
          }
          ts-app-titlebar {
              display: none;
          }
      }

  </style>

  <template>

      <ts-app-titlebar currentuser="[[currentuser]]"></ts-app-titlebar>
      <neon-animated-pages attr-for-selected="data-route" selected="{{route}}">
          <ts-home data-route="home" route="{{route}}" currentproject="{{currentproject}}" projectlist="{{projectlist}}" importdata="{{importdata}}" id="home"></ts-home>
          <ts-new data-route="new" route="{{route}}" importdata="{{importdata}}" projectlist="[[projectlist]]" currentuser="[[currentuser]]" options="{{options}}" on-finishusfm="finishUsfmImport"></ts-new>
          <ts-translate data-route="translate" route="{{route}}" message="{{message}}" projectlist="[[projectlist]]" currentproject="{{currentproject}}" currentuser="[[currentuser]]" options="{{options}}" id="translate" on-update="updateFromProject" on-exportusfm="exportUsfm" on-openprint="openPrint"></ts-translate>
          <ts-review data-route="review" route="{{route}}" currentproject="{{currentproject}}" currentuser="[[currentuser]]" options="{{options}}"></ts-review>
          <ts-settings data-route="settings" route="{{route}}" currentproject="[[currentproject]]" options="{{options}}" id="settings"></ts-settings>
          <ts-profile data-route="profile" route="{{route}}" currentuser="[[currentuser]]" options="{{options}}"></ts-profile>
          <ts-print data-route="preview" route="{{route}}" currentproject="[[currentproject]]" options="{{options}}" id="preview"></ts-print>
          <ts-updates data-route="updates" route="{{route}}" options="{{options}}"></ts-updates>
          <ts-terms data-route="terms"></ts-terms>
      </neon-animated-pages>
      <div id="statusbar">
          <span>{{translate("status")}}: </span><span id="message">{{message}}</span>
      </div>

      <paper-dialog id="print" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-print-options id="printoptions" currentproject="{{currentproject}}" options="{{options}}" on-openpreview="openPreview"></ts-print-options>
      </paper-dialog>

      <paper-dialog id="feedback" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-feedback feedback="{{feedback}}" on-close="closeFeedback" on-send="sendFeedback"></ts-feedback>
      </paper-dialog>

      <paper-dialog id="import" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-import-options on-project="startProjectImport" on-usfm="startUsfmImport" on-repo="openRepoImport" on-container="startContainerImport"></ts-import-options>
      </paper-dialog>

      <paper-dialog id="repo" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-repo-search id="reposearch" importdata="{{importdata}}" on-cancel="cancelRepo" on-startrepoimport="startRepoImport"></ts-repo-search>
      </paper-dialog>

      <paper-dialog id="loading" class="popup" modal="true" exit-animation="scale-down-animation">
          <ts-loading options="[[options]]"></ts-loading>
      </paper-dialog>

      <paper-dialog id="wideloading" class="popup" modal="true" exit-animation="scale-down-animation">
          <ts-loading options="[[options]]"></ts-loading>
      </paper-dialog>

      <paper-dialog id="export" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-export-options on-project="exportProject" on-upload="uploadProject" on-checkprint="checkPrint" on-checkusfm="checkUsfm" currentproject="[[currentproject]]"></ts-export-options>
      </paper-dialog>

      <paper-dialog id="update" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-update-options on-language="updateLanguageList" on-source="updateSourceList" on-download="downloadSources" on-index="updateIndex"></ts-update-options>
      </paper-dialog>

      <paper-dialog id="license" class="popup legal" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-license></ts-license>
      </paper-dialog>

      <paper-dialog id="guidelines" class="popup legal" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-guidelines></ts-guidelines>
      </paper-dialog>

      <paper-dialog id="statement" class="popup legal" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-statement></ts-statement>
      </paper-dialog>

      <paper-dialog id="software" class="popup legal" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-software></ts-software>
      </paper-dialog>

      <paper-dialog id="conflict" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-conflict currentproject="[[currentproject]]" importdata="{{importdata}}" currentuser="[[currentuser]]" on-startrepoimport="startRepoImport"></ts-conflict>
      </paper-dialog>

      <paper-dialog id="importconfirm" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-import-confirm importdata="{{importdata}}" on-cancel="clearTempDir" on-finishimport="finishImport"></ts-import-confirm>
      </paper-dialog>

      <paper-dialog id="containerconfirm" class="popup" modal="true" entry-animation="scale-up-animation" exit-animation="scale-down-animation">
          <ts-container-confirm on-finish="finishContainerImport"></ts-container-confirm>
      </paper-dialog>

      <iron-signals on-iron-signal-openfeedback="openFeedback"></iron-signals>
      <iron-signals on-iron-signal-openimport="openImport"></iron-signals>
      <iron-signals on-iron-signal-openexport="openExport"></iron-signals>
      <iron-signals on-iron-signal-updateuser="updateUser"></iron-signals>
      <iron-signals on-iron-signal-openlicense="openLicense"></iron-signals>
      <iron-signals on-iron-signal-openguidelines="openGuidelines"></iron-signals>
      <iron-signals on-iron-signal-openstatement="openStatement"></iron-signals>
      <iron-signals on-iron-signal-opensoftware="openSoftware"></iron-signals>
      <iron-signals on-iron-signal-changeproject="changeProject"></iron-signals>
      <iron-signals on-iron-signal-deleteproject="deleteProject"></iron-signals>
      <iron-signals on-iron-signal-openupdate="openUpdate"></iron-signals>
      <iron-signals on-iron-signal-openloading="openLoading"></iron-signals>
      <iron-signals on-iron-signal-closeloading="closeLoading"></iron-signals>
      <iron-signals on-iron-signal-updatesourcelist="updateSourceList"></iron-signals>
      <iron-signals on-iron-signal-showmessage="openMessagePopup"></iron-signals>
      <iron-signals on-iron-signal-updatespellchecking="updateSpellChecking"></iron-signals>

  </template>

</dom-module>

<script>

  Polymer({
      is: 'ts-dashboard',

      properties: {
          route: {
              type: String,
              value: ''
          },
          projectlist: {
              type: Array,
              value: []
          },
          currentproject: {
              type: Object,
              value: {}
          },
          feedback: {
              type: String,
              value: ""
          },
          currentuser: {
              type: Object,
              value: {}
          },
          importdata: {
              type: Object,
              value: {}
          },
          options: {
              type: Object,
              value: {}
          },
          message: {
              type: String,
              value: "Idle"
          }
      },

      openLicense: function () {
          var legal = this.$.license;
          legal.open();
          setTimeout(function () {
              legal.scrollTop = 0;
          }, 250);
      },

      openGuidelines: function () {
          var legal = this.$.guidelines;
          legal.open();
          setTimeout(function () {
              legal.scrollTop = 0;
          }, 250);
      },

      openStatement: function () {
          var legal = this.$.statement;
          legal.open();
          setTimeout(function () {
              legal.scrollTop = 0;
          }, 250);
      },

      openSoftware: function () {
          var legal = this.$.software;
          legal.open();
          setTimeout(function () {
              legal.scrollTop = 0;
          }, 250);
      },

      updateSpellChecking: function (event, enabled) {
          App.ipc.send('update-spellcheck', enabled);
      },

      updateUser: function (event, data) {
          App.configurator.setValue("userdata", data);
          this.checkUser(data);
      },

      checkUser: function (user) {
          this.set('currentuser', user);
          if (user.full_name) {
              if (user.accepted) {
                  this.set('route', 'home');
              } else {
                  this.set('route', 'terms');
              }
          } else {
              this.set('route', 'profile');
          }
      },

      openLoading: function () {
          this.$.loading.open();
      },

      closeLoading: function () {
          this.$.loading.entryAnimation = "scale-up-animation";
          this.$.loading.close();
      },

      showLoadingMessage: function (msg) {
          this.set('options', {});
          this.set('options.body', msg);
          this.set('options.loading', true);
          this.openLoading();
      },

      showMessage: function (title, body) {
          this.set('options', {});
          this.set('options.title', title);
          this.set('options.body', body);
          this.set('options.loading', false);
          this.$.wideloading.close();
          this.openLoading();
      },

      showErrorMessage: function (title, defaultBody, err) {
          App.reporter.logError(err, title, 1);
          const message = typeof defaultBody === 'string' ? defaultBody : JSON.stringify(defaultBody, null, 2);
          this.showMessage(title, message);
      },

      showConflictsMessage: function (title, body, conflicts) {
          var msg = body;

          if (conflicts && conflicts.length) {
              App.reporter.logNotice(conflicts, App.translate("conflicts"));
              if (conflicts.length === 1) {
                  msg += App.translate("single_chunk_conflict_message");
              } else {
                  msg += App.translate("multiple_chunk_conflict_message");
              }
          }

          this.showMessage(title, msg);
      },

      openMessagePopup: function (event, data) {
          var title = data.title;
          var message = data.message;
          this.$.loading.entryAnimation = "scale-up-animation";
          this.showMessage(title, message);
      },

      openUpdate: function () {
          this.$.update.open();
      },

      updateLanguageList: function () {
          const mythis = this;
          const before = App.dataManager.getMetrics();

          const onProgress = function (type, total, complete) {
              if (complete === 7000) {
                  mythis.set('options.value', 66);
              }
          };

          mythis.$.update.close();
          mythis.showLoadingMessage(App.translate("updating_target_status"));
          mythis.set('options.progress', true);
          mythis.set('options.value', 33);

          setTimeout(function () {
              return App.dataManager.updateLanguages(onProgress)
                  .then(function () {
                      const after = App.dataManager.getMetrics();
                      const diff = after.target_language_count - before.target_language_count;
                      let msg = App.translate("number_target_updates", diff);
                      if (diff < 1) {
                          msg = App.translate("no_target_updates");
                      }
                      mythis.showMessage(App.translate("update_complete"), msg);
                  })
                  .catch(function (err) {
                      let errorMessage;
                      if (err.syscall === "getaddrinfo") {
                          errorMessage = App.translate("connection_error");
                      } else if (err.syscall === "read") {
                          errorMessage = App.translate("read_error");
                      } else {
                          errorMessage = err.data?.message || err.message || err.stderr || App.translate("update_error");
                      }
                      mythis.showErrorMessage(App.translate("update_failed"), errorMessage, err);
                  });
          }, 500);
      },

      updateSourceList: function () {
          const mythis = this;
          const before = App.dataManager.getMetrics();
          let end = false;

          const onProgress = function (type, total, complete) {
              let value = 0;

              if (type === "projects") {
                  value = Math.round(complete / total * 10);
              } else if (type === "resources") {
                  value = Math.round(complete / total * 88) + 10;
                  end = true;
              } else if (end) {
                  value = 99;
              }
              mythis.set('options.value', value);
          };

          mythis.$.update.close();
          mythis.showLoadingMessage(App.translate("source_update_status"));
          mythis.set('options.progress', true);
          mythis.set('options.value', 0);

          setTimeout(function () {
              return App.dataManager.updateSources(onProgress)
                  .then(function () {
                      const after = App.dataManager.getMetrics();
                      const diff = after.resource_count_level3 - before.resource_count_level3;
                      let msg = App.translate('new_sources_available', diff);
                      if (diff < 1) {
                          msg = App.translate('no_sources_available');
                      }
                      mythis.set('route', 'updates');
                      mythis.showMessage(App.translate('update_complete'), msg);
                  })
                  .catch(function (err) {
                      let errorMessage;
                      if (err.syscall === "getaddrinfo") {
                          errorMessage = App.translate("connection_error");
                      } else if (err.syscall === "read") {
                          errorMessage = App.translate("read_error");
                      } else {
                          errorMessage = err.data?.message || err.message || err.stderr || App.translate('update_error');
                      }
                      mythis.showErrorMessage(App.translate("update_failed"), errorMessage, err);
                  });
          }, 500);
      },

      updateIndex: function () {
          const mythis = this;

          mythis.$.update.close();
          mythis.showLoadingMessage(App.translate("updating_index_file_status"));
          mythis.set('options.progress', false);
          mythis.set('options.value', 0);

          setTimeout(function () {
              App.dataManager.updateIndex(function (progress) {
                  mythis.set('options.value', progress);
              }).then(function () {
                  console.log("Done.");
                  App.ipc.send('fire-reload');
              })
              .catch (function (err) {
                  mythis.showErrorMessage(App.translate("download_failed"), `${App.translate("download_index_file_error")} (${err})`, err);
              });
          }, 500);
      },

      downloadSources: function () {
          const mythis = this;

          mythis.$.update.close();
          mythis.showLoadingMessage(App.translate("source_loading_status"));

          setTimeout(function() {
              mythis.set('route', 'updates');
          }, 500);
      },

      deleteProject: function (event, data) {
          const mythis = this;
          const projectmeta = data.projectmeta;

          mythis.showLoadingMessage(App.translate("deleting_project_status"));

          setTimeout(function() {
              return App.exportManager.autoBackupTranslation(projectmeta)
                  .then(function () {
                      return App.projectsManager.deleteTargetTranslation(projectmeta)
                  })
                  .then(function() {
                      App.projectsManager.unsetValues(projectmeta.unique_id);

                      var list = mythis.projectlist;
                      var newlist = list.filter(function (item) {
                          return item.unique_id !== projectmeta.unique_id;
                      });

                      return mythis.sortProjects(newlist);
                  })
                  .then(function () {
                      mythis.showMessage(App.translate("project_deleted1"), App.translate("project_deleted2"));
                  })
                  .catch(function () {
                      mythis.deleteCorruptProject(projectmeta);
                  })
          }, 500);
      },

      deleteCorruptProject: function (projectmeta) {
          var mythis = this;
          App.projectsManager.backupProject(projectmeta.projectDir)
              .then(function () {
                  return App.projectsManager.deleteTargetTranslation(projectmeta)
              })
              .then(function() {
                  App.projectsManager.unsetValues(projectmeta.unique_id);

                  var list = mythis.projectlist;
                  var newlist = list.filter(function (item) {
                      return item.unique_id !== projectmeta.unique_id;
                  });

                  return mythis.sortProjects(newlist);
              })
              .then(function () {
                  mythis.showMessage(App.translate("project_deleted1"), App.translate("project_deleted2"));
              })
              .catch(function (err) {
                  mythis.showErrorMessage(App.translate('delete_failed1'), App.translate('delete_failed2'), err);
              })
      },

      changeProject: function (event, data) {
          const mythis = this;
          let conflicts = [];
          const changedata = data;
          let newmanifest = changedata.newmeta;

          mythis.set('route', 'home');
          mythis.showLoadingMessage(App.translate("changing_project_status"));

          setTimeout(function () {
              return Promise.resolve(true)
                  .then(function () {
                      if (changedata.exists) {
                          return App.gitManager.merge(mythis.currentuser, changedata.newpaths.projectDir, changedata.oldpaths.projectDir)
                              .then(function (data) {
                                  conflicts = data.conflicts;
                                  newmanifest = data.manifest;
                                  return Promise.resolve(true);
                              })
                              .then(function () {
                                  return App.utils.fs.remove(changedata.oldpaths.projectDir);
                              });
                      } else {
                          return App.utils.fs.mover(changedata.oldpaths.projectDir, changedata.newpaths.projectDir)
                              .then(function () {
                                  return App.projectsManager.saveTargetManifest(changedata.newmeta);
                              })
                              .then(function () {
                                  return App.projectsManager.commitProject(changedata.newmeta, mythis.currentuser);
                              });
                      }
                  })
                  .then(function () {
                      App.projectsManager.unsetValues(changedata.oldmeta.unique_id);

                      var list = mythis.projectlist;
                      var newlist = list.filter(function (item) {
                          return item.unique_id !== changedata.oldmeta.unique_id && item.unique_id !== changedata.newmeta.unique_id;
                      });

                      newlist.push(App.projectsManager.updateManifestToMeta(newmanifest));

                      return mythis.sortProjects(newlist);
                  })
                  .then(function () {
                      mythis.showConflictsMessage(App.translate("project_changed1"), App.translate("project_changed2"), conflicts);
                  })
                  .catch(function(err) {
                      mythis.showErrorMessage(App.translate("change_failed1"), App.translate("change_failed2"), err);
                  });
          }, 500);
      },

      openImport: function () {
          this.$.import.open();
      },

      openRepoImport: function () {
          var mythis = this;

          this.$.import.close();
          this.set('importdata', {username: this.currentuser.username, project: ""});
          this.$.repo.open();

          setTimeout(function() {
              mythis.$.reposearch.searchRepos();
          }, 500);
      },

      cancelRepo: function () {
          this.$.repo.close();
          this.openImport();
      },

      startRepoImport: function () {
          var mythis = this;
          var path = App.path;
          var repo = this.importdata.repo.repo;
          var project = this.importdata.repo.project;
          var force = this.importdata.force || false;
          var server = App.configurator.getUserSetting("dataserver");
          var repourl = server + "/" + repo;
          var targetDir = App.configurator.getValue('targetTranslationsDir');
          var tmpDir = App.configurator.getValue('tempDir');
          var targetPath = path.join(targetDir, project);
          var tmpPath = path.join(tmpDir, project);

          mythis.$.repo.close();
          if (mythis.route !== "home") {
              mythis.set('route', 'home');
              mythis.$.translate.reset();
          }
          mythis.showLoadingMessage(App.translate("importing_status"));

          setTimeout(function() {
              return App.utils.fs.mkdirs(tmpPath)
                  .then(function () {
                      return App.gitManager.clone(repourl, tmpDir)
                  })
                  .then(function () {
                      var paths = App.utils.makeProjectPaths(tmpDir, project);
                      return App.migrateManager.migrate(paths);
                  })
                  .then(function (data) {
                      project = data.paths.projectDir.split(path.sep).pop();
                      targetPath = path.join(targetDir, project);
                      tmpPath = path.join(tmpDir, project);
                      mythis.set('importdata.targetpath', targetPath);
                      mythis.set('importdata.tmppath', tmpPath);
                      return App.utils.fs.stat(targetPath).then(App.utils.ret(true)).catch(App.utils.ret(false));
                  })
                  .then(function (exists) {
                      if (force) {
                          mythis.set('importdata.overwrite', false);
                          return mythis.finishImport();
                      } else if (exists) {
                          mythis.closeLoading();
                          mythis.$.importconfirm.open();
                      } else {
                          mythis.set('importdata.overwrite', true);
                          return mythis.finishImport();
                      }
                  })
                  .catch(function(err) {
                      mythis.showErrorMessage(App.translate("import_failed1"), App.translate("import_failed2"), err && err.error ? err.error : err);

                      return mythis.clearTempDir();
                  });
          }, 500);
      },

      startProjectImport: function() {
          var mythis = this;
          var defaultPath = App.configurator.getUserPath('datalocation', 'backups');
          var filePath = App.ipc.sendSync('open-file', {options: {defaultPath: defaultPath, filters: [{name: App.translate("tstudio_files"), extensions: ['tstudio']}], properties: ['openFile']}});
          if (!filePath) {
              return;
          }

          mythis.$.import.close();
          mythis.showLoadingMessage(App.translate("importing_status"));

          setTimeout(function() {
              return App.importManager.extractBackup(filePath[0])
                  .then(function (list) {
                      return Promise.all(list.map(function (item) {
                          mythis.set('importdata', {targetpath: item.targetPath, tmppath: item.tmpPath});
                          if (item.targetExists) {
                              mythis.closeLoading();
                              mythis.$.importconfirm.open();
                          } else {
                              mythis.set('importdata.overwrite', true);
                              return mythis.finishImport();
                          }
                      }))
                  })
                  .catch(function(err) {
                      let errorMessage;

                      if (err.includes(App.translate("extraction_error"))) {
                          errorMessage = err;
                      } else {
                          errorMessage = err.data?.message || err.message || err.stderr || App.translate('import_failed2');
                      }

                      mythis.showErrorMessage(App.translate('import_failed1'), errorMessage, err);

                      return mythis.clearTempDir();
                  });
          }, 500);
      },

      finishImport: function () {
          var mythis = this;
          var path = App.path;
          var conflicts = [];
          var overwrite = this.importdata.overwrite;
          var targetPath = this.importdata.targetpath;
          var tmpPath = this.importdata.tmppath;
          var key = targetPath.split(path.sep).pop();
          var newmanifest = {};

          mythis.showLoadingMessage(App.translate("importing_status"));

          setTimeout(function() {
              return Promise.resolve(true)
                  .then(function () {
                      if (overwrite) {
                          App.projectsManager.unsetValues(key);
                          return App.utils.fs.mover(tmpPath, targetPath)
                              .then(function () {
                                  return App.projectsManager.retrieveManifest(targetPath);
                              })
                              .then(function (manifest) {
                                  newmanifest = manifest;
                                  return Promise.resolve(true);
                              });
                      } else {
                          return App.gitManager.merge(mythis.currentuser, targetPath, tmpPath)
                              .then(function (data) {
                                  conflicts = data.conflicts;
                                  newmanifest = data.manifest;
                                  return Promise.resolve(true);
                              });
                      }
                  })
                  .then(function () {
                      return mythis.clearTempDir();
                  })
                  .then(function () {
                      var promises = mythis.checkProjectContainers([newmanifest]);

                      return Promise.all(promises);
                  })
                  .then(function() {
                      var list = mythis.projectlist;
                      var meta = _.cloneDeep(App.projectsManager.updateManifestToMeta(newmanifest));
                      var newlist = list.filter(function (item) {
                          return item.unique_id !== meta.unique_id;
                      });

                      newlist.push(App.projectsManager.updateManifestToMeta(newmanifest));

                      return mythis.sortProjects(newlist);
                  })
                  .then(function () {
                      mythis.showConflictsMessage(App.translate("project_imported1"), App.translate("project_imported2"), conflicts);
                  })
                  .catch(function(err) {
                      mythis.showErrorMessage(App.translate("import_failed1"), App.translate("import_failed2"), err && err.error ? err.error : err);

                      return mythis.clearTempDir();
                  });
          }, 500);
      },

      clearTempDir: function () {
          return App.utils.fs.remove(App.configurator.getValue('tempDir'));
      },

      startUsfmImport: function () {
          var mythis = this;
          var defaultPath = App.configurator.getUserPath('datalocation', 'backups');
          var filePath = App.ipc.sendSync('open-file', {options: {defaultPath: defaultPath, filters: [{name: App.translate("usfm_format"), extensions: ['txt', 'usfm']}], properties: ['openFile']}});
          if (!filePath) {
              return;
          }

          mythis.$.import.close();

          return App.importManager.retrieveUSFMProjectID(filePath[0])
              .then(function (id) {
                  var name = "";
                  if (id) {
                      var data = App.dataManager.getProjectName(id);
                      if (data) {
                          name = data;
                      } else {
                          id = "";
                      }
                  }
                  mythis.set('importdata', {importing: true, filepath: filePath[0], project: {slug: id, name: name}});
                  mythis.set('route', 'new');
              }).catch(function (err) {
                  var filename = (filePath && filePath[0]) || '';
                  mythis.showErrorMessage(App.translate("import_failed"), App.translate("read_file_error", filename), err);
              });
      },

      finishUsfmImport: function () {
          var mythis = this;
          var user = this.currentuser;
          var filepath = this.importdata.filepath;
          var projectmeta = this.importdata.projectmeta;
          var overwrite = this.importdata.overwrite;
          var timeString = App.utils.getTimeStamp();
          var backupName = projectmeta.unique_id + '.' + timeString + '.tstudio';
          var backupPath = App.configurator.getUserPath('datalocation', 'backups', backupName);

          mythis.showLoadingMessage(App.translate("importing_status"));

          setTimeout(function() {
              return Promise.resolve(true)
                  .then(function () {
                      if (overwrite) {
                          return App.exportManager.backupTranslation(projectmeta, backupPath);
                      } else {
                          return Promise.resolve(true);
                      }
                  })
                  .then(function () {
                      return App.importManager.importFromUSFM(filepath, projectmeta);
                  })
                  .then(function (chunks) {
                      return App.projectsManager.createTargetTranslation(chunks, projectmeta, user);
                  })
                  .then(function () {
                      const list = mythis.projectlist;
                      const meta = _.cloneDeep(projectmeta);
                      const newlist = list.filter(function (item) {
                          return item.unique_id !== meta.unique_id;
                      });

                      newlist.push(App.projectsManager.updateManifestToMeta(meta));

                      return mythis.sortProjects(newlist);
                  })
                  .then(function () {
                      mythis.showMessage(App.translate("project_imported1"), App.translate("project_imported3"));
                  })
                  .catch(function (err) {
                      mythis.showErrorMessage(App.translate('import_failed1'), App.translate("import_failed2"), err);

                      if (overwrite) {
                          return App.importManager.extractBackup(backupPath)
                              .then(function (list) {
                                  return Promise.all(list.map(function (item) {
                                      return App.utils.fs.mover(item.tmpPath, item.targetPath);
                                  }))
                              })
                              .then(function () {
                                  return mythis.clearTempDir();
                              })
                              .catch(function () {
                                  return mythis.clearTempDir();
                              });
                      }
                  });
          }, 500);
      },

      startContainerImport: function () {
          var mythis = this;
          var defaultPath = App.configurator.getUserPath('datalocation', 'backups');
          var filePath = App.ipc.sendSync('open-file', {options: {defaultPath: defaultPath, properties: ['openDirectory']}});
          if (!filePath) {
              return;
          }

          mythis.set('importdata', {filepath: filePath[0]});
          mythis.$.import.close();
          mythis.showLoadingMessage(App.translate("importing_source_status"));

          setTimeout(function() {
              return App.dataManager.checkForContainer(filePath[0])
                  .then(function(exists) {
                      if (exists) {
                          mythis.closeLoading();
                          mythis.$.containerconfirm.open();
                      } else {
                          return mythis.finishContainerImport();
                      }
                  });
          }, 500);
      },

      finishContainerImport: function () {
          var mythis = this;
          var filePath = this.importdata.filepath;

          mythis.showLoadingMessage(App.translate("importing_source_status"));

          setTimeout(function() {
              return App.dataManager.importContainer(filePath)
                  .then(function() {
                      mythis.showMessage(App.translate("project_imported1"), App.translate("source_imported"));
                  })
                  .catch(function(err) {
                      var errmessage = App.translate("source_import_failed");

                      if (err.toString()) {
                          errmessage = err.toString();
                      }
                      mythis.showErrorMessage(App.translate("import_failed"), errmessage, err);
                  });
          }, 500);
      },

      openExport: function () {
          this.$.export.open();
      },

      uploadProject: function () {
          const mythis = this;
          const projectmeta = this.currentproject.projectmeta;
          const loading = this.$.wideloading;
          const target = App.configurator.getValue('targetTranslationsDir');
          const paths = App.utils.makeProjectPaths(target, projectmeta);
          const repo = projectmeta.unique_id;
          const user = this.currentuser;
          const shell = App.shell;
          let deviceId = "";

          mythis.$.export.close();
          mythis.set('options', {});
          mythis.set('options.body', App.translate("project_upload"));
          mythis.set('options.loading', true);
          loading.open();

          return App.gitManager.commitAll(user, paths.projectDir)
              .then(function () {
                  return App.utils.getDeviceId();
              })
              .then(function (devId) {
                  deviceId = devId;
                  const getreg = App.keyManager.getRegistrationInfo.bind(App.keyManager, deviceId),
                      genreg = App.keyManager.generateRegistrationInfo.bind(App.keyManager, deviceId),
                      rereg = function () {
                          return App.userManager.unregister(user, deviceId).then(genreg);
                      };

                  return getreg().catch(rereg);
              })
              .then(function (reg) {
                  user.reg = reg;
                  return App.userManager.register(user, deviceId);
              })
              .then(function () {
                  return App.userManager.createRepo(user, repo);
              })
              .then(function (repo) {
                  return App.gitManager.push(user, paths.projectDir, repo).then(App.utils.ret(repo.full_name));
              })
              .then(function (fullname) {
                  const readServer = App.configurator.getUserSetting("readerserver");
                  const readUrl = readServer + "/" + fullname;
                  const dataServer = App.configurator.getUserSetting("dataserver");
                  const dataUrl = dataServer + "/" + fullname;

                  mythis.set('options.title', App.translate("upload_complete"));
                  mythis.set('options.body', App.translate("project_uploaded_to"));
                  mythis.set('options.readlink', readUrl);
                  mythis.set('options.datalink', dataUrl);
                  mythis.set('options.showlink', true);
                  mythis.set('options.loading', false);
                  const links = loading.querySelectorAll(".url");

                  links.forEach((link) => {
                    link.addEventListener('click', function clicker (event) {
                        event.preventDefault();
                        shell.openExternal(link.textContent);
                    });
                  })
              })
              .catch(function (err) {
                  err = err || '';
                  let errorMessage;

                  if (err.syscall === "getaddrinfo") {
                      errorMessage = App.translate("connection_error");
                  } else if (err.status === 401) {
                      errorMessage = App.translate("cannot_upload_whithout_account");
                  } else {
                      errorMessage = err.data?.message || err.message || err.stderr || App.translate("upload_project_error");
                  }

                  if (typeof errorMessage === 'string' && errorMessage.includes("rejected because the remote contains work")) {
                      loading.close();
                      mythis.$.conflict.open();
                  } else {
                      mythis.showErrorMessage(App.translate("upload_failed"), errorMessage, err);
                  }
              });
      },

      exportProject: function () {
          const mythis = this;
          const projectmeta = this.currentproject.projectmeta;
          const defaultPath = App.configurator.getUserPath('datalocation', 'backups', projectmeta.unique_id);
          const filePath = App.ipc.sendSync('save-as', {
              options: {
                  defaultPath: defaultPath,
                  filters: [{name: App.translate("tstudio_files"), extensions: ['tstudio']}]
              }
          });
          if (!filePath) {
              return;
          }

          mythis.$.export.close();
          mythis.showLoadingMessage(App.translate("creating_project_file_status"));

          setTimeout(function() {
              return App.exportManager.backupTranslation(projectmeta, filePath)
                  .then(function () {
                      mythis.showMessage(App.translate("project_export1"), App.translate("project_export2"));
                  })
                  .catch(function (err) {
                      mythis.showErrorMessage(App.translate('project_failed1'), App.translate('project_failed2'), err);
                  });
          }, 500);
      },

      checkPrint: function () {
          var projectmeta = this.currentproject.projectmeta;

          this.$.export.close();

          if (this.route === "home") {
              this.fire('iron-signal', {name: 'loadproject', data: {projectmeta: projectmeta, nav: "print"}});
          } else {
              this.openPrint();
          }
      },

      openPrint: function () {
          this.$.print.open();
          this.$.printoptions.reset();
      },

      openPreview: function () {
          const mythis = this;
          const options = _.cloneDeep(this.options);
          const current = this.route;

          mythis.$.print.close();
          mythis.showLoadingMessage(App.translate("preparing_print_status"));
          if (current === "translate") {
              mythis.fire('iron-signal', {name: 'translateleft'});
          }
          if (current === "review") {
              mythis.fire('iron-signal', {name: 'reviewleft'});
          }

          setTimeout(function() {
              return Promise.resolve(true)
                  .then(function () {
                      if (options.includeImages) {
                          mythis.set('options.body', App.translate('download_images'));
                          return AppAsync.printManager.downloadImages()
                              .then(function(){
                                  mythis.set('options.body', App.translate("extract_images"));
                                  return App.printManager.extractImages();
                              });
                      } else {
                          return Promise.resolve(true);
                      }
                  })
                  .then(function () {
                      mythis.set('options.body', App.translate("print_preview"));
                      setTimeout(function() {
                          mythis.set('currentproject.printoptions', options);
                          mythis.$.preview.rendertext();
                          mythis.closeLoading();
                          App.configurator.setValue("backto", current);
                          mythis.set('route', 'preview');
                      }, 500);
                  })
                  .catch(function(err){
                      let errorMessage = err.data?.message || err.message || err.stderr || App.translate("download_images_error");
                      mythis.showErrorMessage(App.translate("download_failed"), errorMessage, err);
                  });
          }, 500);
      },

      checkUsfm: function () {
          var projectmeta = this.currentproject.projectmeta;

          this.$.export.close();

          if (this.route === "home") {
              this.fire('iron-signal', {name: 'loadproject', data: {projectmeta: projectmeta, nav: "export"}});
          } else {
              this.exportUsfm();
          }
      },

      exportUsfm: function () {
          const mythis = this;
          const projectmeta = this.currentproject.projectmeta;
          const translation = this.currentproject.chunks;
          const conflicts = this.currentproject.conflicts;
          const mediaServer = App.configurator.getUserSetting("mediaserver");
          const name = projectmeta.unique_id;
          const defaultPath = App.configurator.getUserPath('datalocation', name);
          let filePath;

          if (conflicts) {
              mythis.showMessage(App.translate("conflicts_exist"), App.translate("conflicts_request"));
              return;
          }

          if (projectmeta.format === 'markdown') {
              filePath = App.ipc.sendSync('save-as', {options: {defaultPath: defaultPath, filters: [{name: App.translate("zip_format"), extensions: ['zip']}]}});
          } else {
              filePath = App.ipc.sendSync('save-as', {options: {defaultPath: defaultPath, filters: [{name: App.translate("usfm_format"), extensions: ['usfm']}]}});
          }
          if (!filePath) {
              return;
          }

          mythis.showLoadingMessage(App.translate("exporting_project_status"));

          setTimeout(function() {
              return App.exportManager.exportTranslation(translation, projectmeta, filePath, mediaServer)
                  .then(function () {
                      mythis.showMessage(App.translate("project_export3"), App.translate("project_export4"));
                  })
                  .catch(function (err) {
                      let errorMessage = err.data?.message || err.message || err.stderr || App.translate("project_failed3");
                      mythis.showErrorMessage(App.translate("project_failed4"), errorMessage, err);
                  });
          }, 500);
      },

      openFeedback: function () {
          this.set('feedback', '');
          this.$.feedback.open();
      },

      closeFeedback: function () {
          this.$.feedback.close();
      },

      sendFeedback: function () {
          const message = this.feedback;
          const mythis = this;

          mythis.closeFeedback();
          mythis.showLoadingMessage(App.translate("sending_feedback_status"));

          if (App.reporter.canReportToGithub()) {
              return App.reporter.reportBug(message)
                  .then(function (res) {
                      var response;

                      try {
                        response = JSON.parse(res);
                      } catch (e) {}

                      if (response && response.url && response.repository_url) {
                          App.reporter.logNotice(response.url, App.translate("feedback_sent"));
                          mythis.showMessage(App.translate("feedback_sent"), App.translate("feedback_sent2"));
                      } else {
                          !response && App.reporter.logWarning(res, App.translate("feedback_failed2"));
                          mythis.showErrorMessage(App.translate("feedback_failed"), App.translate("feedback_failed3"), response || null);
                      }
                  })
                  .catch(function (err) {
                      let errorMessage;
                      if (err.syscall === "getaddrinfo") {
                          errorMessage = App.translate("connection_error");
                      } else if (err.syscall === "read") {
                          errorMessage = App.translate("read_error");
                      } else {
                          errorMessage = err.data?.message || err.message || err.stderr || App.translate("feedback_failed4");
                      }
                      mythis.showErrorMessage(App.translate("feedback_failed"), errorMessage, err);
                  });
          } else {
              mythis.showErrorMessage(App.translate('feedback_failed'), App.translate("token_error"), null);
          }
      },

      updateFromProject: function () {
          var mythis = this;
          var translate = this.$.translate;

          return Promise.resolve(true)
              .then(function () {
                  var list = mythis.projectlist;
                  var meta = _.cloneDeep(mythis.currentproject.projectmeta);
                  var newlist = list.filter(function (item) {
                      return item.unique_id !== meta.unique_id;
                  });

                  newlist.push(App.projectsManager.updateManifestToMeta(meta));

                  return mythis.sortProjects(newlist);
              })
              .then(function () {
                  mythis.set('route', "home");
                  translate.reset();
                  return Promise.resolve(true);
              })
              .then(function () {
                  mythis.closeLoading();
              });
      },

      sortProjects: function (list) {
          var mythis = this;
          var sorted = App.projectsManager.sortProjectList(list);

          return Promise.resolve(true)
              .then(function () {
                  mythis.set('projectlist', sorted);
                  return Promise.resolve(sorted);
              });
      },

      checkProjectContainers: function (list) {
          var promises = [];
          var strings = {};

          for (var i = 0; i < list.length; i++) {
              var proj = list[i].project.id;

              if ('source_translations' in list[i]) {
                  for (var j = 0; j < list[i].source_translations.length; j++) {
                      var lang = list[i].source_translations[j].language_id;
                      var res = list[i].source_translations[j].resource_id;
                      var string = lang + "_" + proj + "_" + res;
                      if (!strings[string]) {
                          strings[string] = true;
                          var open = App.dataManager.activateProjectContainers(lang, proj, res);
                          promises.push(open);
                      }
                  }
              }
          }

          return promises;
      },

      checkAllContainers: function (list) {
          var promises = this.checkProjectContainers(list);

          promises.push(App.dataManager.activateContainer('en', 'bible', 'tw'));
          promises.push(App.dataManager.activateContainer('en', 'bible-obs', 'tw'));
          promises.push(App.dataManager.activateContainer('en', 'ta-audio', 'vol2'));
          promises.push(App.dataManager.activateContainer('en', 'ta-checking', 'vol1'));
          promises.push(App.dataManager.activateContainer('en', 'ta-checking', 'vol2'));
          promises.push(App.dataManager.activateContainer('en', 'ta-gateway', 'vol3'));
          promises.push(App.dataManager.activateContainer('en', 'ta-intro', 'vol1'));
          promises.push(App.dataManager.activateContainer('en', 'ta-process', 'vol1'));
          promises.push(App.dataManager.activateContainer('en', 'ta-translate', 'vol1'));
          promises.push(App.dataManager.activateContainer('en', 'ta-translate', 'vol2'));

          return Promise.all(promises)
              .then(function () {
                  return list;
              });
      },

      checkBuild: function () {
          const mythis = this;
          const path = App.path;
          const libraryDir = App.configurator.getValue('libraryDir');
          const libraryPath = path.join(libraryDir, "index.sqlite");
          const srcDB = path.join(App.srcDir, 'index', 'index.sqlite');
          const appData = App.configurator.getAppData();
          const libraryBuild = App.configurator.getValue("libraryBuild");
          const tmpDir = App.configurator.getValue('tempDir');
          const resourceDir = App.dataManager.getResourceDir();
          let movePromises = Promise.resolve(true);

          if (!libraryBuild) {
              App.configurator.setUserSetting("bemode", false);
          }

          if (libraryBuild !== appData.build) {
              let translations = [];

              App.ipc.send('loading-status', App.translate("index_update_status"));

              if (parseInt(libraryBuild) >= 110) {
                  translations = App.dataManager.getTranslations();
              }

              const imports = translations.filter(function (item) {
                  return item.resource.imported;
              });

              imports.forEach(function (item) {
                  const foldername = item.language.slug + "_" + item.project.slug + "_" + item.resource.slug;
                  const tmpPath = path.join(tmpDir, foldername);
                  const resourcePath = path.join(resourceDir, foldername);

                  movePromises = movePromises.then(function () {
                      return App.utils.fs.mover(resourcePath, tmpPath);
                  });
              });

              return movePromises
                  .then(function () {
                      return App.utils.fs.readFile(srcDB);
                  })
                  .then(function (content) {
                      return App.utils.fs.writeFile(libraryPath, content);
                  })
                  .then(function () {
                      App.configurator.setValue("libraryBuild", appData.build);
                      if (imports.length) {
                          return App.utils.fs.readdir(tmpDir);
                      }
                      return [];
                  })
                  .then(function (temps) {
                      let importPromises = Promise.resolve(true);

                      temps.forEach(function (item) {
                          const itemPath = path.join(tmpDir, item);

                          importPromises = importPromises.then(function () {
                              return App.dataManager.importContainer(itemPath);
                          });
                      });

                      return importPromises;
                  })
                  .then(function () {
                      return mythis.clearTempDir();
                  })
                  .catch(function (e) {
                      return mythis.clearTempDir();
                  })
                  .then(function () {
                      App.ipc.send('loading-status', App.translate("project_migration_status"));
                      return App.projectsManager.migrateTargetTranslationsList();
                  })
                  .then(function () {
                      return Promise.resolve(true);
                  });
          } else {
              return Promise.resolve(false);
          }
      },

      createInitialSettings: function (version) {
          var untildify = App.untildify;
          var gitversion = version ? version.toString() : 'N/A';

          App.configurator.refreshUserSetting();
          App.configurator.setUserSetting('gitversion', gitversion);
          App.configurator.setUserSetting('appversion', App.configurator.getAppData().version);
          App.configurator.setUserSetting('datapath', App.configurator.getValue('rootdir'));

          var location = App.configurator.getUserSetting('datalocation');
          location = untildify(location);
          location = location.replace(/\\/g, "\/");
          App.configurator.setUserSetting('datalocation', location);

          const languageUrl = App.configurator.getUserSetting('languageurl');
          App.dataManager.updateLanguageUrl(languageUrl);

          App.configurator.applyPrefAppearance();
      },

      translate: App.translate,

      ready: function() {
          var mythis = this;

          mythis.set('message', App.translate("idle"));

          return App.gitManager.verifyGit()
              .then(function (version) {
                  App.ipc.send('loading-status', App.translate("get_user_settings"));
                  App.reporter.logNotice(App.translate("git_version") + version);
                  mythis.createInitialSettings(version);
                  mythis.checkUser(App.configurator.getValue("userdata"));

                  return mythis.checkBuild();
              })
              .then(function (updates) {
                  if (updates) {
                      App.ipc.send('fire-reload');
                      return Promise.resolve(false);
                  } else {
                      App.ipc.send('loading-status', App.translate("get_project_list"));
                      return App.projectsManager.loadTargetTranslationsList()
                          .then(function (list) {
                              App.ipc.send('loading-status', App.translate("get_resource_containers"));
                              return mythis.checkAllContainers(_.compact(list));
                          })
                          .then(function (list) {
                              App.ipc.send('loading-status', App.translate("update_project_list"));
                              return _.compact(list.map(App.projectsManager.updateManifestToMeta, App.projectsManager));
                          })
                          .then(function (list) {
                              return mythis.sortProjects(list);
                          })
                          .then(function (list) {
                              App.ipc.send('loading-status', App.translate("make_backups"));
                              return App.exportManager.backupAllTranslations(list);
                          })
                          .then(function () {
                              App.ipc.send('main-loading-done');
                              mythis.$.home.setsortfields();
                          });
                  }
              })
              .catch(function (err) {
                  let errorMessage;
                  err && err.stack && App.reporter.logError(err.stack, App.translate("startup_error"));

                  if (err && typeof err === 'string') {
                      errorMessage = err;
                  } else if (err && err.toString() !== '[object Object]') {
                      errorMessage = err.toString();
                  } else {
                      errorMessage = err.data?.message || err.message || err.stderr || App.translate("something_broke");
                  }

                  mythis.showErrorMessage(App.translate("startup_error"), errorMessage, err);
                  App.ipc.send('main-loading-done');
                  mythis.$.home.setsortfields();
              });
      }

  });

</script>
